<style>
:root {
  --teal: #1c9c8c; --teal-deep: #147a6e; --teal-tint: #e3f3f1;
  --orange: #e8843c; --orange-tint: #fcefe4;
  --violet: #6b63c4; --lavender: #ecebf8;
  --ink: #1f2a33; --ink-2: #4a5661; --muted: #7c8792;
  --line: #dfe3e8; --bg: #f3f4f6; --card: #fff; --soft: #f7f8fa;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 Inter, system-ui, -apple-system, sans-serif; }
h1, h2, h3, .label, .tab { font-family: Jost, Inter, sans-serif; }
h1 { font-weight: 600; font-size: 22px; margin: 0; letter-spacing: .02em; }
h2 { font-weight: 600; font-size: 16px; margin: 0 0 8px; }
h3 { font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.label { font-weight: 500; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--card); border-radius: 18px; box-shadow: 0 2px 14px rgba(31,42,51,.06); padding: 18px; min-width: 0; }
.mock { display: inline-block; font: 600 11px Jost, sans-serif; letter-spacing: .16em; color: #b45a1c; border: 1.5px solid #e8b48f; background: var(--orange-tint); border-radius: 8px; padding: 3px 9px; }
.tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.tab { border: 0; background: transparent; min-height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 500; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
.tab.on { background: var(--teal); color: #fff; }
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.seg button, .btn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; min-height: 34px; padding: 0 12px; font: 500 12px Inter, sans-serif; color: var(--ink-2); cursor: pointer; }
.seg button.on { border-color: var(--ink); color: var(--ink); background: var(--soft); box-shadow: inset 0 0 0 1px var(--ink); }
.btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
select, input[type=text], textarea { font: 13px Inter, sans-serif; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: #fff; color: var(--ink); }
.chip { display: inline-flex; align-items: baseline; gap: 4px; padding: 2px 8px; margin: 2px 3px 2px 0; border-radius: 7px; background: var(--soft); border: 1px solid var(--line); font-size: 11.5px; color: var(--ink-2); max-width: 100%; }
.chip b { font: 600 10.5px Jost, sans-serif; color: var(--ink); letter-spacing: .04em; }
.chip.on { background: #fff4d6; border-color: #e0b84c; color: var(--ink); }
.chip.fn { background: var(--c); border-color: var(--c); color: #fff; }
.chip.fn b { color: #fff; }
.chip.dim { opacity: .4; }
.tag { display: inline-block; font: 600 9.5px Jost, sans-serif; letter-spacing: .1em; text-transform: uppercase; border-radius: 5px; padding: 1px 6px; margin-left: 4px; vertical-align: 1px; }
.tag-EX { background: var(--teal-tint); color: var(--teal-deep); }
.tag-EXest { background: #fff1c9; color: #8a6400; }
.tag-INT { background: var(--lavender); color: var(--violet); }
.tag-DOC, .tag-OBS { background: #eceef1; color: var(--ink-2); }
.kind { font: 600 9.5px Jost, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; }
.kind.barrier { background: #fde3e3; color: #a32b2b; }
.kind.facilitator { background: #dff2e3; color: #2d7a3d; }
.kind.workaround { background: #fff1c9; color: #8a6400; }
.obs { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.obs:last-child { border-bottom: 0; }
.obs .ids { color: var(--muted); font-size: 11px; }
.bm { width: 100%; height: auto; display: block; }
.bm-label { font: 500 10.5px Inter, sans-serif; fill: var(--ink); }
.bm-id { font: 600 9px Jost, sans-serif; letter-spacing: .08em; fill: var(--muted); }
.bm-floor { font: 600 10px Jost, sans-serif; letter-spacing: .16em; fill: var(--muted); }
.bm-pin { font: 700 9px Jost, sans-serif; fill: #fff; }
.bm-tid { font: 600 8.5px Jost, sans-serif; fill: var(--violet); }
.jpd { width: 100%; height: auto; display: block; }
.jpd-id { font: 700 9.5px Jost, sans-serif; }
.jpd-lab { font: 500 9px Inter, sans-serif; fill: var(--ink-2); }
.jpd-lvl { font: 600 10px Jost, sans-serif; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.note { font-size: 11.5px; color: var(--muted); }
table.grid { width: 100%; border-collapse: collapse; }
table.grid th, table.grid td { text-align: left; vertical-align: top; padding: 7px 9px; border-bottom: 1px solid var(--line); }
table.grid thead th { font: 500 10.5px Jost, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); background: var(--soft); }

</style>
<style>
html, body { height: 100%; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .topbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line); }
  .topbar h1 { font-size: 17px; } .grow { flex: 1; } .saved { font-size: 11px; color: var(--muted); }
  main { flex: 1; min-height: 0; overflow: auto; padding: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  .field > span { font: 500 10.5px Jost; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
  .split > * { min-width: 0; }
  @media (max-width: 1000px) { .split, .grid2 { grid-template-columns: 1fr; } }
  .sticky { position: sticky; top: 0; }
  .plan { position: relative; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; touch-action: none; }
  .plan svg { display: block; width: 100%; height: auto; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tools button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .hint { font-size: 12px; color: var(--ink-2); background: #fffbef; border: 1px solid #f0dfa8; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; }
  .pick { display: flex; flex-wrap: wrap; gap: 5px; }
  .pick button { border: 1px solid var(--line); background: #fff; border-radius: 8px; min-height: 32px; padding: 3px 9px; font: 12px Inter, sans-serif; color: var(--ink-2); cursor: pointer; text-align: left; }
  .pick button b { font: 600 10.5px Jost; color: var(--ink); margin-right: 3px; }
  .pick button.on { background: #fff4d6; border-color: #d9a520; color: var(--ink); box-shadow: inset 0 0 0 1px #d9a520; }
  .grp { font: 500 10px Jost; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 8px 0 3px; width: 100%; }
  .ck { display: grid; grid-template-columns: 54px minmax(0,1fr) auto; gap: 6px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .ck .st { display: inline-flex; gap: 4px; }
  .ck .st button { width: 38px; min-height: 34px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .ck .st button.on.y { background: #dff2e3; border-color: #3f9e4d; } .ck .st button.on.n { background: #fde3e3; border-color: #b23b3b; } .ck .st button.on.q { background: #fff1c9; border-color: #c9971a; }
  .ck input[type=text], .ck select { width: 100%; }
  .ck .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
  .ck .meta select, .ck .meta input { width: auto; font-size: 12px !important; padding: 4px 6px; }
  .absent { text-decoration: line-through; opacity: .45; }
  .jr { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; }
  .jr .par { display: flex; flex-direction: column; gap: 6px; }
  .jr .arr { color: #9aa4ae; font-size: 18px; }
  .sbtn { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 10px; text-align: left; cursor: pointer; min-width: 150px; font: inherit; color: inherit; }
  .sbtn.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
  .sbtn .sn { font: 600 10px Jost; letter-spacing: .1em; color: var(--muted); }
  .sbtn .fx span.f { font: 600 9.5px Jost; color: #fff; border-radius: 4px; padding: 0 5px; margin-right: 2px; }
  .sbtn.event { border-style: dashed; border-color: #a32b2b; }
  .vtabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .vtabs button { border: 1px solid var(--line); background: #fff; border-radius: 9px; min-height: 34px; padding: 0 12px; font: 12px Inter; cursor: pointer; }
  .vtabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .vtabs button.base.on { background: var(--teal); border-color: var(--teal); }
  table.wt { width: 100%; border-collapse: separate; border-spacing: 0; }
  table.wt th, table.wt td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
  table.wt thead th { font: 500 10px Jost; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); background: var(--soft); }
  table.wt td.c { cursor: pointer; min-width: 90px; } table.wt td.c:hover { background: #f7f8fa; }
  table.wt td.c.sel { box-shadow: inset 0 0 0 2px var(--ink); }
  table.wt td.c.ch { background: #fff4d6; } table.wt td.c.ch::after { content: 'changed'; display: block; font: 600 8px Jost; letter-spacing: .12em; color: #8a6400; text-transform: uppercase; }
  table.wt tr.skip td { opacity: .35; text-decoration: line-through; }
  table.wt tr.only td:first-child { box-shadow: inset 4px 0 0 #e8843c; }
  .ci { display: block; margin: 1px 0; } .ci b { font: 600 10px Jost; margin-right: 3px; }
  .vp { display: inline-block; border: 1.2px dashed #1e63c4; color: #1e63c4; border-radius: 5px; padding: 0 5px; margin: 1px 0; }
  .empty { color: #b9c0c8; }
  .ncount { display: inline-block; font: 600 9.5px Jost; background: #fde3e3; color: #a32b2b; border-radius: 5px; padding: 1px 6px; margin-top: 4px; }
  .note-row { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  details summary { cursor: pointer; font-size: 12px; color: var(--ink-2); }
  textarea { width: 100%; min-height: 52px; }
  .stat { display: flex; gap: 10px; flex-wrap: wrap; } .stat div { background: var(--soft); border-radius: 8px; padding: 6px 10px; font-size: 12px; } .stat b { font: 600 18px Jost; display: block; }
  .actions { white-space: nowrap; } .actions .btn { min-height: 28px; padding: 0 7px; font-size: 11.5px; }
  /* in-page dialogs + toast (artifact-safe) */
  .dlg-bg { position: fixed; inset: 0; background: rgba(20,24,30,.38); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .dlg { background: #fff; border-radius: 14px; padding: 18px; width: min(440px, 100%); box-shadow: 0 18px 50px rgba(0,0,0,.25); }
  .dlg p { margin: 0 0 12px; font-size: 14px; line-height: 1.45; }
  .dlg input { width: 100%; font-size: 15px; padding: 9px 10px; }
  .dlg-ch { display: flex; flex-direction: column; gap: 6px; } .dlg-ch .btn { min-height: 42px; text-align: left; }
  .dlg-act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; } .dlg-act .btn { min-height: 40px; padding: 0 16px; }
  .btn.primary.danger { background: #b23b3b; border-color: #b23b3b; }
  #toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: #22252b; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: calc(100% - 32px); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* pilot v3: status marks, steps, IRB gate */
  .st { display: inline-flex; gap: 4px; }
  .st button { width: 40px; min-height: 36px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .st button.on.y { background: #dff2e3; border-color: #3f9e4d; } .st button.on.n { background: #fde3e3; border-color: #b23b3b; } .st button.on.q { background: #fff1c9; border-color: #c9971a; }
  .st-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-2); margin: 4px 0 6px; }
  .st-legend b { display: inline-block; width: 20px; text-align: center; border-radius: 5px; margin-right: 3px; } .st-legend b.y { background: #dff2e3; } .st-legend b.q { background: #fff1c9; } .st-legend b.n { background: #fde3e3; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  @media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }
  .stp { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .stp > b { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font: 600 13px Jost; }
  .stp.done > b { background: var(--teal); color: #fff; }
  .irb { margin-bottom: 10px; } .irb-ok { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; } .irb-ok input { width: 20px; height: 20px; margin-top: 1px; flex: none; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .tscroll { overflow-x: auto; } #tp td input, #tp td select { width: 100%; min-width: 110px; min-height: 34px; }
  /* pilot v3.1: digital-system trees */
  .trees { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; align-items: start; margin-top: 6px; }
  @media (max-width: 760px) { .trees { grid-template-columns: 1fr; } }
  .tree { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .tree.lost { margin-top: 12px; background: #fffbef; border-color: #f0dfa8; }
  .tree-new { border: 2px dashed var(--line); background: transparent; min-height: 120px; display: grid; place-items: center; font: 500 14px Inter, sans-serif; color: var(--ink-2); cursor: pointer; }
  .tree-new b { display: block; font: 600 30px Jost; color: var(--teal); }
  .tn { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; background: var(--soft); border-radius: 10px; padding: 5px 6px 5px 8px; }
  .tn.sys { background: #e3f1f1; border: 1.5px solid var(--teal); }
  .tn.virt { background: #f2f0fb; border: 1.2px dashed #7b6fc7; }
  .tn.gone { opacity: .55; }
  .tn input[type=text] { width: 100%; min-height: 34px; border: 0; background: transparent; font-size: 14px; padding: 2px 4px; }
  .tn.sys input[type=text] { font: 600 15px Jost, sans-serif; }
  .tn .st button { width: 34px; min-height: 32px; font-size: 13px; }
  .tk { font: 600 9px Jost; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .tn.sys .tk { color: var(--teal); } .tn.virt .tk { color: #6b5fc0; }
  .btn.tm { min-height: 32px; width: 34px; padding: 0; font-size: 16px; }
  ul.tb { list-style: none; margin: 0 0 0 16px; padding: 4px 0 0 16px; border-left: 2px solid #c6d4d4; }
  ul.tb li { position: relative; margin: 6px 0; }
  ul.tb li::before { content: ''; position: absolute; left: -16px; top: 21px; width: 14px; border-top: 2px solid #c6d4d4; }
  ul.tb li:last-child::after { content: ''; position: absolute; left: -18px; top: 23px; bottom: -6px; border-left: 2px solid #fff; }
  .tree.lost ul.tb li:last-child::after { border-color: #fffbef; }
  .tadd { margin-top: 10px; } .tadd .btn { min-height: 36px; font-size: 12.5px; }
  /* pilot v3.1: information cards board */
  .board { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 14px; align-items: start; margin-top: 6px; }
  @media (max-width: 860px) { .board { grid-template-columns: 1fr; } }
  .pool { background: var(--soft); border: 2px dashed var(--line); border-radius: 14px; padding: 12px; position: sticky; top: 0; }
  .pool-h, .cat-h { display: flex; align-items: center; gap: 8px; }
  .pool-h h3 { margin: 0; flex: 1; } .n { font: 600 12px Jost; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 1px 9px; }
  .cards { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
  .acard { position: relative; display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #cfd6dc; border-left: 4px solid var(--orange, #e8843c); border-radius: 9px; padding: 8px 10px; min-height: 40px; font-size: 13px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .acard .aid { font: 600 10px Jost; color: var(--muted); }
  .acard.unsure { border-color: #c9971a; background: #fffbef; }
  .acard .aq { font-style: normal; font: 700 11px Inter; background: #c9971a; color: #fff; border-radius: 50%; width: 18px; height: 18px; display: grid; place-items: center; }
  .acard .adel { border: 0; background: #f3f4f6; border-radius: 6px; width: 28px; height: 28px; font-size: 16px; color: #8a2b2b; cursor: pointer; margin-left: 2px; }
  .acard.dragging { opacity: .3; }
  .acard.ghost { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; opacity: .95; box-shadow: 0 10px 28px rgba(0,0,0,.25); }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; align-items: start; }
  .cat { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 92px; }
  .cat.open { grid-column: 1 / -1; }
  .cat-h { cursor: pointer; min-height: 36px; } .cat-h b { flex: 1; font: 600 15px Jost; } .car { color: var(--muted); width: 14px; }
  .peek { font-size: 12px; color: var(--ink-2); margin-top: 6px; line-height: 1.5; }
  .over { border-color: var(--teal) !important; background: #e3f1f1 !important; box-shadow: 0 0 0 3px rgba(15,107,107,.18); }
  .cat-new { border: 2px dashed var(--line); background: transparent; font: 500 14px Inter, sans-serif; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }

</style>

 * Edit here, then run `python3 tools/build.py` to refresh docs/codebook.md and dist/.

 */
window.WT_CODEBOOK = {
 "version": "2.0",
 "functions": [
  {
   "id": "F1",
   "label": "Triage",
   "chain": "decision"

  },
  {

  },
  {
   "id": "F6",
   "label": "Provide requested imaging result",
   "chain": "service"
  },
  {

<script>
/* Shared rendering helpers for expected-result views and the app.
 * Depends on window.WT_CODEBOOK; dataset passed explicitly. */
(function () {
  const FN_COLOR = { F1: '#1c9c8c', F2: '#2f7fc1', F3: '#6b63c4', F4: '#c2417a', F5: '#8a6d3b', F6: '#e8843c', F7: '#c9971a', F8: '#3f9e4d', F9: '#b23b3b' };
  const SC_COLOR = { SC01: '#1c9c8c', SC02: '#e8843c', both: '#5b6772' };
  const ROUTE_COLORS = ['#d81b60', '#00897b', '#1e63c4', '#ef6c00', '#6d4c41'];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function index(D) {
    const by = (arr) => Object.fromEntries((arr || []).map(x => [x.id, x]));
    return {
      D, comp: by(D.components), space: by(D.spaces), art: by(D.artifacts), fn: by(D.functions),
      obs: by(D.observations), pc: by(D.performance), theme: by(D.themes), frame: by(D.frames), sc: by(D.scenarios),
      label(id) { const x = this.comp[id] || this.space[id] || this.art[id] || this.fn[id]; return x ? x.label : id; },
    };
  }

  /* ---------- graph ---------- */
  function adjacency(D, { excludeRestricted = false } = {}) {
    const adj = {};
    D.spaces.forEach(s => adj[s.id] = []);
    D.connections.forEach(c => {
      if (excludeRestricted && c.restriction !== 'none') return;
      if (!adj[c.a] || !adj[c.b]) return;
      adj[c.a].push(c.b); adj[c.b].push(c.a);
    });
    return adj;
  }
  function bfs(adj, root) {
    const depth = { [root]: 0 }, q = [root];
    while (q.length) { const u = q.shift(); (adj[u] || []).forEach(v => { if (!(v in depth)) { depth[v] = depth[u] + 1; q.push(v); } }); }
    return depth;
  }

  /* ---------- bubble map ---------- */
  function bubbleSize(s) {
    if (s.bubble_type === 'corridor') return [150, 30];
    if (s.bubble_type === 'vertical') return [96, 34];
    if (s.bubble_type === 'zone') return [118, 38];
    return [124, 44];
  }
  /* opts: highlight:Set, dim:bool, routes:[{path,color,dash,label}], comps:Set (T ids to show), installs:bool, width, height, onSpace */
  function bubbleMap(D, opts = {}) {
    const W = opts.width || 1000, H = opts.height || 590;
    const hi = opts.highlight || new Set();
    const anyHi = hi.size > 0 || (opts.routes || []).length > 0;
    const S = Object.fromEntries(D.spaces.map(s => [s.id, s]));
    let g = '';
    // floor split
    const upper = D.spaces.filter(s => s.floor > 1);
    if (upper.length) {
      const x0 = Math.min(...upper.map(s => s.x)) - 85;
      g += `<line x1="${x0}" y1="10" x2="${x0}" y2="${H - 10}" stroke="#c9cfd6" stroke-dasharray="4 5"/>`;
      g += `<text x="${x0 - 8}" y="22" text-anchor="end" class="bm-floor">FLOOR 1 · ED</text><text x="${x0 + 8}" y="22" class="bm-floor">UPPER FLOORS</text>`;
    }
    D.connections.forEach(c => {
      const a = S[c.a], b = S[c.b]; if (!a || !b) return;
      const on = hi.has(c.a) && hi.has(c.b);
      const dash = c.type === 'elevator' ? '2 4' : (c.restriction !== 'none' ? '7 4' : '');
      g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${on ? '#5b6772' : '#cfd5db'}" stroke-width="${on ? 3 : 2}" ${dash ? `stroke-dasharray="${dash}"` : ''} opacity="${anyHi && !on ? .55 : 1}"/>`;
    });
    D.spaces.forEach(s => {
      const [w, h] = bubbleSize(s); const on = hi.has(s.id);
      const fill = s.bubble_type === 'corridor' ? '#eef0f2' : s.bubble_type === 'exterior' ? '#fff' : s.bubble_type === 'vertical' ? '#e7ecf3' : '#f6ece2';
      const op = anyHi && !on ? .38 : 1;
      g += `<rect x="${s.x - w / 2}" y="${s.y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="#fff"/>
        <g class="bm-space" data-id="${s.id}" opacity="${op}" style="cursor:${opts.onSpace ? 'pointer' : 'default'}">
        <rect x="${s.x - w / 2}" y="${s.y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${on ? '#fff4d6' : fill}" stroke="${on ? '#b07a00' : '#c9cfd6'}" stroke-width="${on ? 2.2 : 1.2}" ${s.bubble_type === 'exterior' ? 'stroke-dasharray="4 3"' : ''}/>
        <text x="${s.x}" y="${s.y - 2}" text-anchor="middle" class="bm-label">${esc(s.label)}</text>
        <text x="${s.x}" y="${s.y + 11}" text-anchor="middle" class="bm-id">${s.id}${opts.depth && opts.depth[s.id] != null ? ' · d' + opts.depth[s.id] : ''}</text></g>`;
    });
    if (opts.installs !== false) {
      const per = {};
      D.components.filter(c => c.kind === 'T' && c.space).forEach(c => {
        const s = S[c.space]; if (!s) return;
        const k = per[c.space] = (per[c.space] || 0) + 1; const [w, h] = bubbleSize(s);
        const x = s.x + w / 2 - 6 - (k - 1) * 15, y = s.y - h / 2 - 7;
        const on = opts.comps && opts.comps.has(c.id);
        const op = (opts.comps && opts.comps.size && !on) ? .3 : 1;
        g += `<g opacity="${op}"><rect x="${x - 6}" y="${y - 6}" width="12" height="12" rx="2.5" fill="${on ? '#6b63c4' : '#fff'}" stroke="#6b63c4" stroke-width="1.3"/><title>${c.id} ${esc(c.label)}</title>
          ${on ? `<text x="${x}" y="${y - 9}" text-anchor="middle" class="bm-tid">${c.id}</text>` : ''}</g>`;
      });
    }
    (opts.routes || []).forEach((r, i) => {
      const pts = r.path.map(id => S[id]).filter(Boolean); if (pts.length < 2 && !r.single) return;
      const off = (i - ((opts.routes.length - 1) / 2)) * 7;
      const color = r.color || ROUTE_COLORS[i % ROUTE_COLORS.length];
      const mid = `m${i}${Math.random().toString(36).slice(2, 6)}`;
      g += `<defs><marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${color}"/></marker></defs>`;
      g += `<polyline points="${pts.map(p => `${p.x + off},${p.y + off}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3.2" stroke-linejoin="round" ${r.dash ? 'stroke-dasharray="7 5"' : ''} marker-end="url(#${mid})"/>`;
      const p0 = pts[0];
      g += `<circle cx="${p0.x + off}" cy="${p0.y + off}" r="8" fill="${color}"/><text x="${p0.x + off}" y="${p0.y + off + 3.5}" text-anchor="middle" class="bm-pin">${r.label || (i + 1)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="bm" role="img" aria-label="Bubble diagram">${g}</svg>`;
  }

  /* ---------- JPD ---------- */
  function jpd(D, root, opts = {}) {
    const adj = adjacency(D, opts);
    const depth = bfs(adj, root);
    const levels = {};
    Object.entries(depth).forEach(([id, d]) => (levels[d] = levels[d] || []).push(id));
    const maxD = Math.max(...Object.keys(levels).map(Number));
    const W = opts.width || 560, rowH = 70, H = (maxD + 1) * rowH + 40;
    const pos = {};
    Object.entries(levels).forEach(([d, ids]) => {
      ids.sort();
      ids.forEach((id, k) => pos[id] = { x: (k + 1) * W / (ids.length + 1), y: H - 30 - d * rowH });
    });
    const route = opts.route || [];
    const rEdges = new Set(route.slice(1).map((v, i) => [route[i], v].sort().join('|')));
    let g = '';
    for (let d = 0; d <= maxD; d++) g += `<text x="6" y="${H - 26 - d * rowH}" class="jpd-lvl">${d}</text>`;
    D.connections.forEach(c => {
      if (!(c.a in pos) || !(c.b in pos)) return;
      if (opts.excludeRestricted && c.restriction !== 'none') return;
      const on = rEdges.has([c.a, c.b].sort().join('|'));
      g += `<line x1="${pos[c.a].x}" y1="${pos[c.a].y}" x2="${pos[c.b].x}" y2="${pos[c.b].y}" stroke="${on ? (opts.color || '#d81b60') : '#cfd5db'}" stroke-width="${on ? 3.4 : 1.5}" ${c.type === 'elevator' ? 'stroke-dasharray="2 4"' : ''}/>`;
    });
    const S = Object.fromEntries(D.spaces.map(s => [s.id, s]));
    Object.entries(pos).forEach(([id, p]) => {
      const on = route.includes(id) || (opts.mark && opts.mark.has(id)), isRoot = id === root;
      g += `<g><circle cx="${p.x}" cy="${p.y}" r="${isRoot ? 13 : 11}" fill="${isRoot ? '#1f2a33' : on ? (opts.color || '#d81b60') : '#fff'}" stroke="${on || isRoot ? 'none' : '#9aa4ae'}" stroke-width="1.4"/>
        <text x="${p.x}" y="${p.y + 3.5}" text-anchor="middle" class="jpd-id" fill="${on || isRoot ? '#fff' : '#4a5661'}">${id.replace('P', '')}</text>
        <text x="${p.x}" y="${p.y + 24}" text-anchor="middle" class="jpd-lab">${esc((S[id] || {}).label || id)}</text></g>`;
    });
    const unreachable = D.spaces.filter(s => !(s.id in depth)).map(s => s.id);
    const total = Object.values(depth).reduce((a, b) => a + b, 0), n = Object.keys(depth).length - 1;
    return { svg: `<svg viewBox="0 0 ${W} ${H}" class="jpd" role="img" aria-label="Justified plan graph">${g}</svg>`, depth, maxD, meanDepth: n ? (total / n) : 0, unreachable };
  }

  /* ---------- chips ---------- */
  function chip(id, label, cls = '', color) {
    return `<span class="chip ${cls}" ${color ? `style="--c:${color}"` : ''} title="${esc(label)}"><b>${esc(id)}</b> ${esc(label)}</span>`;
  }
  function tag(t) {
    const map = { EX: 'Expert', 'EX-est': 'Expert estimate', DOC: 'Document', OBS: 'Visible', INT: 'Researcher interp.' };
    return `<span class="tag tag-${esc(t).replace(/[^a-z]/gi, '')}">${esc(map[t] || t)}</span>`;
  }

  window.WT = { FN_COLOR, SC_COLOR, ROUTE_COLORS, esc, index, adjacency, bfs, bubbleMap, jpd, chip, tag };
})();

</script>
<script>
/* =====================================================================
   Recorder core (shared by pilot.html and walkthrough.html)
   Pilot: ① Library · ② Space · Pilot & export. Walk mode: walk-frame.js replaces render().
   ===================================================================== */
const MODE = window.WT_MODE || 'walk';   // 'pilot' = site library tool · 'walk' = formal data collection
const CB = window.WT_CODEBOOK, V = CB.vocab, { esc, FN_COLOR } = WT;
const $ = s => document.querySelector(s);
const W = 1000, H = 620;
const STAGES = [...CB.stages.map(s => ({ ...s, kind: 'stage' })), ...CB.events.map(e => ({ ...e, kind: 'event' }))];

/* ---------- storage ---------- */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('wt-' + MODE, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  return {
    async get(k) { try { const db = await open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { try { return JSON.parse(localStorage.getItem(k)); } catch (e2) { return null; } } },
    async set(k, v) { try { const db = await open(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { try { localStorage.setItem(k, JSON.stringify({ ...v, plan: { ...v.plan, image: null } })); return true; } catch (e2) { return false; } } },
  };
})();

/* ---------- state ---------- */
function freshState() {
  const s = CB.seed, today = new Date().toISOString().slice(2, 10).replace(/-/g, '');
  return {
    meta: { mock: false, version: '2.0', app: 'walkthrough-recorder 2.0', created: new Date().toISOString() },
    site: { id: MODE === 'pilot' ? '' : 'S01', label: '' }, session: { id: `S01-${today}-${MODE === 'pilot' ? 'P1' : 'W1'}`, expert: '', recorder: '' }, libSource: null,
    lib: {
      sub: CB.subfunctions.map(x => ({ ...x, pilot: 'seed' })),
      comp: [
        ...s.roles.map(r => ({ id: r.id, label: r.label, kind: 'R', group: r.group, pilot: 'seed', note: '' })),
        ...s.physical.map(t => ({ id: t.id, label: t.label, kind: 'T', type: t.type, mobility: t.mobility, space: null, pos: null, pilot: 'seed', note: '' })),
        ...s.digital.map(d => ({ id: d.id, label: d.label, kind: 'D', type: d.type, parent: d.parent || null, pilot: 'seed', note: '' })),
      ],
      art: s.artifacts.map(a => ({ ...a, cat: null, pilot: 'seed' })),
      artCats: V.info_category.map((c, i) => ({ id: 'AC' + (i + 1), label: c })),
      virt: s.virtual.map(v => ({ ...v, pilot: 'seed' })),
      chan: V.channel.map((c, i) => ({ id: 'CH' + String(i + 1).padStart(2, '0'), label: c, pilot: 'seed' })),
      cond: s.conditions.map(c => ({ ...c, values: [...c.values], pilot: 'seed' })),
    },
    spaces: [], connections: [], plan: { image: null, opacity: .55, irbOk: false },
    walk: Object.fromEntries(STAGES.map(st => [st.id, { steps: [], vars: [], probe: '' }])),
    notes: [], frames: [],
  };
}
let S = null;
let ui = { tab: MODE === 'pilot' ? 'library' : 'walk', lg: 'R', catOpen: null, lfn: null, mode: 'select', sel: null, connFrom: null, pendingInstall: null, stage: 'S1', vid: null, cell: null };
const nextId = (arr, prefix, pad = 2) => { let n = 1; const ids = new Set(arr.map(x => x.id)); while (ids.has(prefix + String(n).padStart(pad, '0'))) n++; return prefix + String(n).padStart(pad, '0'); };
const byId = (arr, id) => arr.find(x => x.id === id);
const label = id => { const x = [...S.lib.sub, ...S.lib.comp, ...S.lib.art, ...S.lib.virt, ...S.spaces].find(y => y.id === id); return x ? x.label : id; };
const comps = () => S.lib.comp;
const live = arr => arr.filter(x => x.pilot !== 'absent');
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
let saveT = null;
function save() { $('#saved').textContent = 'saving…'; clearTimeout(saveT); saveT = setTimeout(async () => { const ok = await store.set('state', S); $('#saved').textContent = ok ? 'saved in this browser · ' + new Date().toLocaleTimeString() : 'NOT saved — export now'; }, 300); }
const seg = (name, opts, val) => `<div class="seg" data-seg="${name}">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<button data-v="${esc(v)}" class="${v === val ? 'on' : ''}">${esc(l)}</button>`; }).join('')}</div>`;

/* ---------- in-page dialogs (artifact viewers block prompt / confirm / alert) ---------- */
function uiAsk({ text, input = false, value = '', ok = 'OK', danger = false, choices = null }) {
  return new Promise(res => {
    document.querySelectorAll('.dlg-bg').forEach(x => x._done ? x._done(null) : x.remove());   // never stack dialogs (double tap)
    const bg = document.createElement('div'); bg.className = 'dlg-bg';
    bg.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><p>${esc(text)}</p>${input ? `<input type="text" id="dlg-in" value="${esc(value)}">` : ''}${choices ? `<div class="dlg-ch">${choices.map(([v, l]) => `<button class="btn" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>` : ''}<div class="dlg-act"><button class="btn" data-c="0">Cancel</button>${choices ? '' : `<button class="btn primary ${danger ? 'danger' : ''}" data-c="1">${esc(ok)}</button>`}</div></div>`;
    document.body.appendChild(bg);
    const inp = bg.querySelector('#dlg-in'); setTimeout(() => (inp || bg.querySelector('[data-c="1"]') || bg.querySelector('[data-v]')).focus(), 30);
    const done = v => { bg.remove(); res(v); }; bg._done = done;
    bg.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('button'); if (e.target === bg) return done(null); if (!b) return;
      if (b.dataset.v !== undefined) return done(b.dataset.v); if (b.dataset.c === '0') return done(null); done(input ? (inp.value.trim() || null) : true); });
    bg.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') done(null); if (e.key === 'Enter' && !choices) { e.preventDefault(); done(input ? (inp.value.trim() || null) : true); } });
  });
}
const uiPrompt = (text, value = '') => uiAsk({ text, input: true, value });
const uiConfirm = (text, ok = 'Delete') => uiAsk({ text, ok, danger: /delete|clear|replace/i.test(ok) }).then(r => r === true);
const uiChoose = (text, choices) => uiAsk({ text, choices });
function toast(msg) { let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); } t.textContent = msg; t.className = 'on'; clearTimeout(t._h); t._h = setTimeout(() => { t.className = ''; }, 2600); }

/* ---------- tabs ---------- */
const TABS = MODE === 'pilot'
  ? [['library', '① Virtual library'], ['space', '② Physical mapping'], ['export', 'Pilot & export']]
  : [];   // walk mode: walk-frame.js replaces render()

$('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; ui.tab = b.dataset.t; render(); };

/* =====================================================================
   ① LIBRARY — pre-filled checklist that becomes the hierarchies
   ===================================================================== */
const LG = [['R', 'People / roles'], ['D', 'Digital systems + virtual spaces'], ['chan', 'Channels'], ['art', 'Information / artifacts'], ['cond', 'Key conditions']];
const TTYPES = ['installation', 'equipment', 'touchpoint', 'tool'];
const isOk = x => x.pilot === 'present' || x.pilot === 'added' || x.pilot === 'added-in-session';
function libItems(g) { return g === 'R' ? comps().filter(c => c.kind === 'R') : g === 'D' ? comps().filter(c => c.kind === 'D') : g === 'T' ? comps().filter(c => c.kind === 'T') : S.lib[g] || []; }
const stBtns = x => `<div class="st"><button class="y ${isOk(x) ? 'on' : ''}" data-st="present" title="confirmed" aria-label="confirmed">✓</button><button class="q ${x.pilot === 'unsure' ? 'on' : ''}" data-st="unsure" title="to confirm" aria-label="to confirm">?</button><button class="n ${x.pilot === 'absent' ? 'on' : ''}" data-st="absent" title="not at this site" aria-label="not at this site">✗</button></div>`;
const setSt = (it, v) => { it.pilot = (v === 'present' ? isOk(it) : it.pilot === v) ? 'seed' : v; };
const confirmSeed = it => { if (it.pilot === 'seed') it.pilot = 'present'; };
/* digital systems: each top-level system is one tree; subsystems hang off it; virtual spaces hang off a system or subsystem (virt.system) */
const dRoots = () => comps().filter(c => c.kind === 'D' && !byId(comps(), c.parent));
const dKids = id => comps().filter(c => c.kind === 'D' && c.parent === id);
const vKids = id => S.lib.virt.filter(v => v.system === id);
const dRoot = id => { let x = byId(comps(), id); while (x && x.parent && byId(comps(), x.parent)) x = byId(comps(), x.parent); return x; };
const catOf = a => (S.lib.artCats || []).find(c => c.id === a.cat);
function rLib() {
  const g = ui.lg = LG.some(([k]) => k === ui.lg) ? ui.lg : 'R';
  const tally = it => `✓${it.filter(isOk).length} ?${it.filter(x => x.pilot === 'unsure').length} · ${it.length}`;
  const cnt = k => k === 'D' ? `${dRoots().length} trees` : k === 'art' ? `${S.lib.art.filter(catOf).length}/${S.lib.art.length} sorted` : tally(libItems(k));
  const HELP = {
    R: 'Roles involved in the case. Roles only, no names. The group is optional and can be fixed later.',
    D: 'One tree per digital system: its subsystems and the virtual spaces where work happens or waits (chart, queue, message thread, video session). Physical equipment goes on the Physical mapping tab.',
    chan: 'How information is passed: in person, phone, pager, secure message, EHR, video. How channels are modelled is still open, so record what is used.',
    art: 'Drag each card into a category. Tap a card to rename, mark ? or delete it. Tap a category to open it and move or delete its cards.',
    cond: 'Circumstances that change who does what, how or where (time, staffing, resources, earlier events). Ask: "When would this be done by someone else, another way or somewhere else?" First value = usual.' };

    ${body}</div>`;
  const m = $('#main');

  m.onclick = async e => {
    const sb = e.target.closest('[data-seg=lg] button'); if (sb) { ui.lg = sb.dataset.v; rLib(); return; }
    if (g === 'D') return treeClick(e);

  m.oninput = e => { const f = e.target.dataset.f; if (f !== 'label' && f !== 'note') return; const it = findLibItem(e.target.closest('[data-id]')); if (it) { it[f] = e.target.value; save(); } };
  m.onchange = async e => {
    const row = e.target.closest('[data-id]'); const it = findLibItem(row); const f = e.target.dataset.f; if (!it || !f || f === 'label' || f === 'note') return;
    if (f === 'group' && e.target.value === '__new') { const n = await uiPrompt('Name of the new group'); if (n) it.group = n; save(); rLib(); return; }
    if (f === 'values') it.values = e.target.value.split(',').map(x => x.trim()).filter(Boolean); else it[f] = e.target.value;
    save();

}
function findLibItem(row) { if (!row) return null; const id = row.dataset.id; return byId(comps(), id) || byId(S.lib.virt, id) || byId(S.lib.chan, id) || byId(S.lib.cond, id) || byId(S.lib.art, id); }

async function listClick(e, g) {

  if (g === 'R') S.lib.comp.push({ id: nextId(comps(), 'R'), label: lab, kind: 'R', group: 'Other', pilot: 'added', note: '' });
  else if (g === 'chan') S.lib.chan.push({ id: nextId(S.lib.chan, 'CH'), label: lab, pilot: 'added' });
  else if (g === 'cond') S.lib.cond.push({ id: nextId(S.lib.cond, 'K', 1), label: lab, source: 'overall', values: ['usual', 'changed'], pilot: 'added' });

/* ---- digital systems + virtual spaces: one tree per system ---- */
function treesHtml() {
  const node = (x, kind) => `<div class="tn ${kind} ${x.pilot === 'absent' ? 'gone' : ''}" data-id="${esc(x.id)}" data-kind="${kind}"><span class="tk">${kind === 'sys' ? (x.type === 'processor' ? 'processor' : 'system') : kind === 'sub' ? 'subsystem' : 'virtual space'}</span><input type="text" data-f="label" value="${esc(x.label)}" class="${x.pilot === 'absent' ? 'absent' : ''}">${stBtns(x)}<button class="btn tm" data-tmenu aria-label="more">⋯</button></div>`;
  const kids = id => { const items = [...dKids(id).map(d => `<li>${node(d, 'sub')}${kids(d.id)}</li>`), ...vKids(id).map(v => `<li>${node(v, 'virt')}</li>`)]; return items.length ? `<ul class="tb">${items.join('')}</ul>` : ''; };
  const lost = S.lib.virt.filter(v => !byId(comps(), v.system));
  return `<div class="trees">${dRoots().map(r => `<div class="tree" data-root="${r.id}">${node(r, 'sys')}${kids(r.id)}
      <div class="row tadd"><button class="btn" data-tadd="sub">+ subsystem</button><button class="btn" data-tadd="virt">+ virtual space</button></div></div>`).join('')}
    <button class="tree tree-new" data-act="newsys"><b>+</b>New digital system</button></div>
    ${lost.length ? `<div class="tree lost"><div class="note"><b>Virtual spaces not linked to a system</b> · tap ⋯ to link</div><ul class="tb">${lost.map(v => `<li>${node(v, 'virt')}</li>`).join('')}</ul></div>` : ''}`;
}
async function treeClick(e) {
  const stb = e.target.closest('[data-st]'); if (stb) { setSt(findLibItem(stb.closest('[data-id]')), stb.dataset.st); save(); rLib(); return; }
  if (e.target.closest('[data-act=newsys]')) { const lab = await uiPrompt('Name of the digital system'); if (!lab) return; S.lib.comp.push({ id: nextId(comps().filter(c => c.kind === 'D'), 'D'), label: lab, kind: 'D', type: 'system', parent: null, pilot: 'added', note: '' }); save(); rLib(); return; }
  const ta = e.target.closest('[data-tadd]'); if (ta) return treeAdd(ta.closest('[data-root]').dataset.root, ta.dataset.tadd);
  const tm = e.target.closest('[data-tmenu]'); if (!tm) return;
  const n = tm.closest('[data-id]'), kind = n.dataset.kind, it = findLibItem(n);
  const targets = () => comps().filter(c => c.kind === 'D').map(c => [c.id, (c.parent ? '   └ ' : '') + c.label]);
  const ch = await uiChoose(`${it.label}`, [...(kind !== 'virt' ? [['virt', '+ Add virtual space here']] : []), ...(kind === 'sys' ? [['sub', '+ Add subsystem']] : []), ...(kind !== 'sys' ? [['move', 'Move to another system…']] : []), ['del', 'Delete']]);
  if (ch === 'virt' || ch === 'sub') return treeAdd(it.id, ch);
  if (ch === 'move') { const to = await uiChoose(`Move "${it.label}" under…`, targets().filter(([id]) => id !== it.id && (kind === 'virt' || !byId(comps(), id).parent))); if (!to) return; if (kind === 'virt') it.system = to; else it.parent = to; }
  if (ch === 'del') {
    const subs = kind === 'sys' ? dKids(it.id) : [];
    if (!await uiConfirm(`Delete "${it.label}"${subs.length ? ` and its ${subs.length} subsystem(s)` : ''}? Its virtual spaces stay, unlinked.`)) return;
    if (kind === 'virt') S.lib.virt = S.lib.virt.filter(v => v !== it);
    else { const gone = new Set([it.id, ...subs.map(s => s.id)]); S.lib.comp = S.lib.comp.filter(c => !gone.has(c.id)); }
  }
  if (!ch) return; save(); rLib();
}
async function treeAdd(parentId, what) {
  const lab = await uiPrompt(what === 'sub' ? 'Name of the subsystem' : 'Name of the virtual space (e.g. chart, queue, thread)'); if (!lab) return;
  if (what === 'sub') { const root = dRoot(parentId); S.lib.comp.push({ id: nextId(comps(), root.id + '.', 1), label: lab, kind: 'D', type: 'subsystem', parent: root.id, pilot: 'added', note: '' }); }
  else S.lib.virt.push({ id: nextId(S.lib.virt, 'V'), label: lab, system: parentId, pilot: 'added' });
  confirmSeed(dRoot(parentId)); save(); rLib();
}

/* ---- information / artifacts: cards sorted into categories by dragging ---- */

  const card = (a, del) => `<div class="acard ${a.pilot === 'unsure' ? 'unsure' : ''}" data-card="${esc(a.id)}"><span class="aid">${esc(a.id)}</span><span class="al">${esc(a.label)}</span>${a.pilot === 'unsure' ? '<i class="aq">?</i>' : ''}${del ? `<button class="adel" data-cdel aria-label="delete">×</button>` : ''}</div>`;

async function cardMenu(a) {

async function boardClick(e) {

  if (e.target.closest('[data-act=newcat]')) { const lab = await uiPrompt('Name of the new category'); if (!lab) return; const id = nextId(S.lib.artCats, 'AC', 1); S.lib.artCats.push({ id, label: lab }); ui.catOpen = id; save(); rLib(); return; }
  const cm = e.target.closest('[data-catmenu]'); if (cm) { const c = byId(S.lib.artCats, cm.dataset.catmenu);
    const ch = await uiChoose(c.label, [['rename', 'Rename category'], ['del', 'Delete category (cards go back to "Cards to sort")']]);
    if (ch === 'rename') { const v = await uiPrompt('Category name', c.label); if (v) c.label = v; }
    if (ch === 'del') { if (!await uiConfirm(`Delete the category "${c.label}"? Its cards go back to "Cards to sort".`)) return; S.lib.artCats = S.lib.artCats.filter(x => x !== c); S.lib.art.forEach(a => { if (a.cat === c.id) a.cat = null; }); }
    if (ch) { save(); rLib(); } return; }
  const co = e.target.closest('[data-catopen]'); if (co) { ui.catOpen = ui.catOpen === co.dataset.catopen ? null : co.dataset.catopen; rLib(); }
}
let cardDrag = null;
function bindBoard() {
  const m = $('#main');
  const end = () => { if (!cardDrag) return; cardDrag.ghost && cardDrag.ghost.remove(); cardDrag.el.classList.remove('dragging'); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); clearInterval(cardDrag.scroll); };
  const dropAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('[data-drop]'); };
  m.onpointerdown = e => {
    const c = e.target.closest('[data-card]'); if (!c) return;
    if (e.target.closest('[data-cdel]')) return;
    cardDrag = { id: c.dataset.card, el: c, x0: e.clientX, y0: e.clientY, started: false };
    try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  };
  m.onpointermove = e => {
    const d = cardDrag; if (!d) return;
    if (!d.started) { if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 8) return;
      d.started = true; const r = d.el.getBoundingClientRect(); d.dx = d.x0 - r.left; d.dy = d.y0 - r.top;
      d.ghost = d.el.cloneNode(true); d.ghost.classList.add('ghost'); d.ghost.style.width = r.width + 'px'; document.body.appendChild(d.ghost); d.el.classList.add('dragging'); }
    d.ghost.style.transform = `translate(${e.clientX - d.dx}px, ${e.clientY - d.dy}px)`;
    const z = dropAt(e.clientX, e.clientY); document.querySelectorAll('.over').forEach(x => { if (x !== z) x.classList.remove('over'); }); z && z.classList.add('over');
    /* auto-scroll when dragging near the top / bottom of the page */
    const mr = m.getBoundingClientRect(), v = e.clientY < mr.top + 60 ? -14 : e.clientY > mr.bottom - 60 ? 14 : 0;
    clearInterval(d.scroll); if (v) d.scroll = setInterval(() => { m.scrollTop += v; }, 16);
  };
  m.onpointerup = e => {
    const d = cardDrag; if (!d) return; const a = byId(S.lib.art, d.id), z = d.started && dropAt(e.clientX, e.clientY);
    end(); cardDrag = null;
    if (!d.started) { cardMenu(a); return; }
    if (z) { a.cat = z.dataset.drop || null; if (a.cat) confirmSeed(a); save(); }
    rLib();
  };
  m.onpointercancel = () => { end(); cardDrag = null; };
}

/* =====================================================================
   ② SPACE — plan photo, bubbles, connections, installations
   ===================================================================== */
const MODES = [['select', 'Select / move'], ['bubble', '+ Bubble'], ['connect', '+ Connection'], ['install', '+ Installation / touchpoint'], ['delete', 'Delete']];
const HINTS = { select: 'Tap to select, drag to move.', bubble: 'Tap where a space is. Corridors are their own bubble.', connect: 'Tap two bubbles people can pass between directly. Adjacent ≠ connected.', install: 'Tap a bubble, then pick the installation on the right.', delete: 'Tap a bubble, connection or installation to delete.' };
const gridBg = () => { let g = `<rect width="${W}" height="${H}" fill="#fafbfc"/>`; for (let x = 0; x <= W; x += 50) g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#eef0f2"/>`; for (let y = 0; y <= H; y += 50) g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#eef0f2"/>`; return g; };
function planSvg({ route = null, id = 'plan-svg', mark = null, instOn = null } = {}) {
  const img = S.plan.image ? `<image href="${S.plan.image}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid meet" opacity="${S.plan.opacity}"/>` : gridBg();
  let g = '';

      <h2 style="margin-top:12px">Export site library</h2><p class="note">This file is what the <b>Walkthrough</b> page imports before each formal session.</p>
      <div class="row"><button class="btn primary" data-x="lib-json">Download site library (JSON)</button><button class="btn" data-x="library">library.csv</button><button class="btn" data-x="spaces">spaces.csv</button><button class="btn" data-x="connections">connections.csv</button></div>
      <div class="stat" style="margin-top:10px"><div><b>${n(comps().filter(c => c.kind === 'R'))}</b>roles ✓</div><div><b>${dRoots().length}</b>digital system trees</div><div><b>${n(S.lib.chan)}</b>channels ✓</div><div><b>${n(S.lib.virt)}</b>virtual spaces ✓</div><div><b>${S.lib.art.filter(catOf).length}/${S.lib.art.length}</b>information cards sorted</div><div><b>${n(S.lib.cond)}</b>conditions ✓</div><div><b>${S.spaces.length}</b>bubbles</div><div><b>${S.connections.length}</b>connections</div><div><b>${comps().filter(c => c.kind === 'T' && c.space).length}</b>touchpoints linked</div><div><b>${[...S.lib.comp, ...S.lib.chan, ...S.lib.virt, ...S.lib.art, ...S.lib.cond].filter(x => x.pilot === 'unsure').length + S.spaces.filter(x => x.evidence.status === 'to-confirm').length + S.connections.filter(x => x.evidence.status === 'to-confirm').length}</b>marked ? to confirm</div></div></div>
    <div class="card"><h2>Load / reset</h2>
      <div class="row"><button class="btn" data-x="import">Import site library…</button><span class="note">continue editing a saved library</span></div>
      <div class="row"><button class="btn" data-x="demo">Load demo spaces</button><span class="note">practice — replaces current</span></div>
      <div class="row"><button class="btn" data-x="reset" style="color:#a32b2b">Reset everything</button></div></div></div>`;
  $('#main').onclick = async e => {
    const sb = e.target.closest('[data-seg=site] button'); if (sb) { S.site.id = sb.dataset.v; S.site.label = sb.dataset.v; S.session.id = sb.dataset.v + '-pilot'; save(); rExportPilot(); return; }
    const b = e.target.closest('[data-x]'); if (!b) return; const x = b.dataset.x;
    if (x !== 'import' && x !== 'demo' && x !== 'reset' && !S.site.id) { toast('Choose WCM or LWH first.'); return; }
    if (x === 'lib-json') download(base + '.json', JSON.stringify(siteLibrary(), null, 1), 'application/json');
    if (x === 'library') download(base + '_library.csv', libraryCsv(), 'text/csv');
    if (x === 'spaces') download(base + '_spaces.csv', toCsv(S.spaces), 'text/csv');
    if (x === 'connections') download(base + '_connections.csv', toCsv(S.connections), 'text/csv');
    if (x === 'import') $('#file-json').click();
    if (x === 'demo') { if (!await uiConfirm('Replace the current pilot data with the demo spaces?', 'Load demo')) return; S = demo(); S.walk = freshState().walk; S.notes = []; save(); render(); }
    if (x === 'reset') { if (!await uiConfirm('Delete all pilot data stored on this device? Export the site library first.', 'Delete all')) return; S = freshState(); save(); render(); } };
}

$('#file-json').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try {
    const d = JSON.parse(r.result);
    if (MODE === 'walk' && d.meta && d.meta.kind === 'site-library') {           // library hand-off from the Pilot page
      Object.assign(S, { site: d.site, lib: d.lib, spaces: d.spaces, connections: d.connections, plan: d.plan || S.plan, libSource: `${f.name}` });
    } else if (MODE === 'pilot' && d.meta && d.meta.kind === 'site-library') {
      S = upgrade({ ...freshState(), site: d.site, lib: d.lib, spaces: d.spaces, connections: d.connections, plan: d.plan || { image: null, opacity: .55 } });
    } else { delete d.frames; delete d.stages; S = upgrade(d); }
    save(); render(); toast('Imported ' + f.name);
  } catch (err) { toast('Could not read this file: ' + err.message); } };
  r.readAsText(f); e.target.value = ''; };
function upgrade(d) { const b = freshState(); for (const k of Object.keys(b)) if (d[k] == null) d[k] = b[k]; for (const k of Object.keys(b.lib)) if (!d.lib[k]) d.lib[k] = b.lib[k]; STAGES.forEach(st => { d.walk[st.id] = d.walk[st.id] || { steps: [], vars: [], probe: '' }; });
  d.lib.virt.forEach(v => { if (v.system === undefined) { const sd = CB.seed.virtual.find(x => x.id === v.id); v.system = sd ? sd.system : null; } }); return d; }

/* ---------- demo: mock spaces + S5 baseline and one variation ---------- */
function demo() {
  const d = freshState(), M = window.WT_DATA;
  d.spaces = M.spaces.map(s => ({ ...s, note: '' })); d.connections = M.connections.map(c => ({ ...c, detail: '' }));
  const place = { T01: 'P03', T03: 'P10', T05: 'P08', T06: 'P08', T07: 'P08', T08: 'P06', T09: 'P17', T10: 'P12' };
  const k = {}; d.lib.comp.forEach(c => { if (place[c.id]) { const s = d.spaces.find(x => x.id === place[c.id]); k[s.id] = (k[s.id] || 0) + 1; c.space = s.id; c.pos = { x: s.x + 70 - k[s.id] * 22, y: s.y - 32 }; c.pilot = 'present'; } });
  const st = (id, sub, people, tools, inputs, outputs, places, route = []) => ({ id, sub, people, tools, inputs, outputs, places, route, only: null });
  d.walk.S5.steps = [
    st('TK001', 'F3.3', ['R03'], ['D01.1', 'D07'], ['A10'], ['A11'], ['P07', 'V02']),
    st('TK002', 'F8.1', ['R08'], ['D06'], ['A11'], ['A12'], ['P13', 'V03']),
    st('TK003', 'F8.2', ['R02'], ['T05'], ['A12'], ['A13'], ['P08'], ['P07', 'P05', 'P08', 'P05', 'P07']),
    st('TK004', 'F9.2', ['R02'], ['T11', 'D01.2'], ['A13'], ['A14'], ['P07']),
  ];
  d.walk.S5.vars = [{ id: 'S5-V1', when: { K1: 'admitted', K2: 'night', K4: 'remote' }, over: {
    TK001: { people: ['R11'], tools: ['D01.1'], places: ['P17', 'V02'] }, TK002: { places: ['V03'] },
    TK003: { people: ['R10'], tools: ['T09'], places: ['P17'], route: ['P16', 'P15', 'P17', 'P15', 'P16'] }, TK004: { people: ['R10'], places: ['P16'] } } }];
  const n = (id, text, step, sub) => ({ id, text, kind: 'barrier', source: 'EX', stage: 'S5', step, sub, variation: 'S5-V1', when: { K1: 'admitted', K2: 'night', K4: 'remote' }, coding: { theme: '', failure: '', consequence: '', control: '', pc: '' } });
  d.notes = [n('N01', 'order set not on ward', 'TK001', 'F3.3'), n('N02', 'night queue no stroke flag', 'TK002', 'F8.1')];
  d.session.expert = 'demo'; d.site.label = 'DEMO';
  return d;
}

/* ---------- boot ---------- */
(async () => { const saved = await store.get('state'); S = saved ? upgrade(saved) : freshState(); render(); $('#saved').textContent = saved ? 'restored from this browser' : 'new — nothing saved yet'; })();

</script>
</body>
</html>
