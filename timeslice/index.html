<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Slice Recorder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --teal: #1c9c8c; --teal-deep: #147a6e; --teal-tint: #e3f3f1;
  --orange: #e8843c; --orange-tint: #fcefe4;
  --violet: #6b63c4; --lavender: #ecebf8;
  --blue: #1e63c4; --blue-tint: #e7f1fb;
  --ink: #1f2a33; --ink-2: #4a5661; --muted: #7c8792;
  --line: #dfe3e8; --bg: #f3f4f6; --soft: #f7f8fa; --bad: #a32b2b;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 Inter, -apple-system, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: Jost, -apple-system, sans-serif; margin: 0; }
.app { display: flex; flex-direction: column; height: 100%; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: max(8px, env(safe-area-inset-top)) 14px 8px; background: #fff; border-bottom: 1px solid var(--line); }
.top h1 { font-size: 18px; font-weight: 600; }
.sid { font: 600 12px Jost; color: var(--teal-deep); background: var(--teal-tint); border-radius: 6px; padding: 2px 8px; }
.sid:empty { display: none; }
#tabs { display: flex; gap: 4px; flex: 1; }
#tabs button { border: 1px solid var(--line); background: #fff; border-radius: 9px; min-height: 38px; padding: 0 14px; cursor: pointer; }
#tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.saved { font-size: 11px; color: var(--muted); }
main { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }

.btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; min-height: 40px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--teal-deep); color: #fff; border-color: var(--teal-deep); }
.btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.primary.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.big { min-height: 48px; font-size: 15px; padding: 0 20px; font-weight: 600; }
.btn.sm { min-height: 32px; padding: 0 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1; }
input[type=text], input[type=number], select, textarea { border: 1px solid var(--line); border-radius: 9px; background: #fff; min-height: 40px; padding: 6px 10px; width: 100%; }
textarea { min-height: 60px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #fff; }
.seg button { border: 0; border-right: 1px solid var(--line); background: #fff; min-height: 40px; padding: 0 14px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--teal-deep); color: #fff; font-weight: 600; }
.seg.src button.on[data-v=Est] { background: var(--orange); }
.seg.src button.on[data-v=Sim] { background: var(--blue); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; min-height: 36px; padding: 0 12px; cursor: pointer; font-size: 13px; }
.chip.on { background: var(--teal-tint); border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
.chip.dig { border-color: #b9c9e6; color: #1e4f99; }
.chip.add { border-style: dashed; color: var(--teal-deep); }
.chip.sm { min-height: 30px; font-size: 12px; padding: 0 10px; }
.grp { font: 600 10px Jost; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 10px 0 5px; }

/* layout */
.rec { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; align-items: start; }
.rec > * { min-width: 0; }
.list { position: sticky; top: 0; max-height: calc(100dvh - 90px); overflow-y: auto; }
.lh { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; } .lh b { font: 600 15px Jost; }
.sl { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 10px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer; }
.sl.on { box-shadow: 0 0 0 2px var(--ink); }
.sl b { font: 600 14px Jost; } .sl .d { font-size: 12px; color: var(--ink-2); margin-left: 6px; }
.sl .c { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add-wide { width: 100%; border-style: dashed; color: var(--teal-deep); font-weight: 600; }
.rule { font-size: 12px; color: var(--ink-2); background: #fffbef; border: 1px solid #f0dfa8; border-radius: 9px; padding: 7px 9px; margin-top: 8px; line-height: 1.45; }

.sh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.sh h2 { font-size: 24px; }
.cut { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12.5px; margin-bottom: 12px; }
.cut b { font: 600 10px Jost; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cut span { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.cut .warn { background: #fdecec; border-color: #f2c4c4; color: var(--bad); }
.sec { margin-bottom: 16px; }
.st { display: flex; align-items: center; gap: 8px; font: 600 15px Jost; margin-bottom: 8px; }
.st .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--teal-tint); color: var(--teal-deep); font-size: 12px; }
.st .r { margin-left: auto; font: 400 12px Inter; color: var(--muted); }
.when { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.when input { width: 110px; }

.rc { border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
.rc.same { border-left-color: #c3c9d0; background: var(--soft); }
.rc-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rc-h .nm { font: 600 15px Jost; }
.rc-h .inst { border: 1px solid var(--line); background: #fff; border-radius: 6px; min-height: 28px; padding: 0 7px; cursor: pointer; font-size: 12px; }
.tag { font: 600 10px Jost; letter-spacing: .1em; text-transform: uppercase; border-radius: 5px; padding: 2px 7px; background: #eceef1; color: var(--muted); }
.tag.new { background: var(--teal-tint); color: var(--teal-deep); }
.tag.chg { background: #fff4d6; color: #8a6400; }
.fl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.fl > label { font: 600 11px Jost; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.wbtn { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 9px; min-height: 40px; padding: 4px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.wbtn .k { font: 600 9.5px Jost; letter-spacing: .1em; padding: 1px 6px; border-radius: 4px; background: var(--teal-tint); color: var(--teal-deep); }
.wbtn .k.dig { background: var(--blue-tint); color: #1e4f99; }
.wbtn.empty { color: var(--muted); }
.sugs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.sugs .chip { min-height: 28px; font-size: 11.5px; padding: 0 9px; }
.sameview { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.sameview i { color: var(--muted); }
.cv { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 20px minmax(0, 1.4fr) auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.cv .arr { text-align: center; color: var(--muted); }
.empty-ed { min-height: 50vh; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 10px; padding: 32px; }
.empty-ed h2 { font-size: 24px; } .empty-ed p { max-width: 560px; line-height: 1.5; margin: 0; }

/* table */
.tscroll { overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
table.dt { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.dt th, .dt td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.dt th { position: sticky; top: 0; background: var(--soft); font: 600 11px Jost; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.dt tr.s0 td { border-top: 2px solid var(--ink-2); }
.dt td.same { color: var(--muted); font-style: italic; }
.dt tr[data-go] { cursor: pointer; }

/* session */
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
.cols h3 { margin-bottom: 8px; }
.srow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.pill { font-size: 12px; border-radius: 999px; padding: 2px 9px; background: #eceef1; }
.pill.ok { background: var(--teal-tint); color: var(--teal-deep); }
.welcome { max-width: 640px; margin: 24px auto; display: grid; gap: 12px; }

/* dialogs */
.dlg-bg { position: fixed; inset: 0; background: rgba(20,28,36,.42); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dlg { background: #fff; border-radius: 14px; padding: 16px; width: min(560px, 100%); max-height: 88dvh; overflow: auto; }
.dlg.wide { width: min(980px, 100%); }
.dlg p { margin: 0 0 10px; }
.dlg-act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 14px; opacity: 0; transition: .2s; z-index: 60; font-size: 13px; pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* where picker map */
.dwrap { position: relative; }
.dia { height: min(52dvh, 520px); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #FBFAF7; }
.dia svg { width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
.dia .np { pointer-events: none; }
.dia .pt { cursor: pointer; }
.floors { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.floors button { border: 0; border-bottom: 1px solid var(--line); background: #fff; min-height: 38px; padding: 0 12px; cursor: pointer; font-size: 12.5px; text-align: left; }
.floors button:last-child { border-bottom: 0; }
.floors button.on { background: var(--teal-deep); color: #fff; font-weight: 600; }
.zooms { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.zooms button { border: 0; border-bottom: 1px solid var(--line); background: #fff; width: 42px; height: 40px; font-size: 19px; cursor: pointer; }
.zooms button:last-child { border-bottom: 0; }
.zooms button[data-v="0"], .zooms button[data-v="site"] { font-size: 11px; font-weight: 600; }
.ptabs { display: flex; gap: 4px; margin-bottom: 10px; }

@media (max-width: 760px) {
  .rec { grid-template-columns: 1fr; }
  .list { position: static; max-height: none; }
  .cv { grid-template-columns: 1fr 1fr; } .cv .arr { display: none; }
}
/* suggestions appear only for the field being typed in */
.fl .sugs { display: none; }
.fl > div:focus-within .sugs { display: flex; }

/* ===== v2: step panels, swim lanes, stopwatch ===== */
.edc { display: flex; flex-direction: column; height: calc(100dvh - 90px); padding: 12px 0 0; overflow: hidden; }
.edc > .sh, .edc > .cond, .edc > .when, .edc > .cut, .edc > .stabs { margin-left: 16px; margin-right: 16px; }
.sh { margin-bottom: 6px; }
.tm { font: 600 12px Jost; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tm.big { font-size: 16px; background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; }
.tag.var { background: var(--orange-tint); color: #b45a1c; }
.cond { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--orange-tint); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; font-size: 13px; }
.cond b { font: 600 10px Jost; letter-spacing: .12em; text-transform: uppercase; color: #b45a1c; }
.when { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.when label { font: 600 11px Jost; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.when input { width: 110px; }
.cut { margin-bottom: 8px; }
.stabs { display: flex; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.stabs button { flex: 1; min-height: 44px; border: 1px solid var(--line); background: #fff; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.stabs button b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--teal-tint); color: var(--teal-deep); font: 600 11px Jost; margin-right: 5px; }
.stabs button.ok b { background: var(--teal); color: #fff; }
.stabs button.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); font-weight: 600; }
.steps { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.step { flex: 0 0 100%; min-width: 0; overflow-y: auto; overscroll-behavior-y: contain; scroll-snap-align: start; scroll-snap-stop: always; padding: 10px 16px 90px; }
.stepnav { display: flex; gap: 8px; align-items: center; padding-top: 12px; margin-top: 10px; border-top: 1px solid var(--line); }
.ph { font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }

/* swim lane bands inside a step */
.lane { display: grid; grid-template-columns: 96px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 8px; background: #fff; }
.lane-h { background: color-mix(in srgb, var(--lc) 12%, #fff); border-right: 3px solid var(--lc); color: var(--lc); font: 600 13px Jost; padding: 10px 8px; writing-mode: horizontal-tb; }
.lane-b { padding: 6px; display: grid; gap: 6px; }
.lane-b .rc { margin: 0; border-left-width: 1px; }
.rc-h .bd, .wr .bd { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 5px; border-radius: 12px; color: #fff; font: 700 11px Jost; flex: none; }
.fld { position: relative; }
.fld .sugs { display: none; } .fld:focus-within .sugs { display: flex; }
.task { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.task input { width: 84px; min-height: 34px; }
.seg.sm button { min-height: 32px; padding: 0 9px; font-size: 12px; }
.addrow { margin-top: 8px; max-width: 320px; }

/* where: role picker + map with role badges */
.who-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.wr { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--lc); background: #fff; border-radius: 10px; padding: 5px 9px; cursor: pointer; min-height: 44px; }
.wr.on { box-shadow: 0 0 0 2px var(--ink); }
.wr b { font: 600 13px Jost; }
.dia.empty { display: grid; place-items: center; color: var(--muted); font-size: 13px; height: 120px; }

/* slice list */
.sl-h { display: flex; align-items: baseline; gap: 6px; }
.sl-h .tm { margin-left: auto; }
.sl .d { display: block; margin: 0; }
.sl.var { margin-left: 14px; width: calc(100% - 14px); border-left-color: var(--orange); border-style: dashed; border-left-style: solid; }

/* stopwatch bar */
#timer { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: var(--ink); color: #fff; border-radius: 14px; padding: 8px 10px 8px 14px; z-index: 40; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 24px); flex-wrap: wrap; }
#timer .tl { font-size: 12.5px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#timer .tv { font: 600 26px Jost; font-variant-numeric: tabular-nums; min-width: 96px; text-align: center; }
#timer .btn { min-height: 38px; }
#timer .btn:not(.primary):not(.danger) { background: #2f3d48; color: #fff; border-color: #2f3d48; }

/* swim-lane overview */
table.sw { border-collapse: collapse; font-size: 12px; min-width: 100%; }
.sw th, .sw td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; min-width: 170px; }
.sw thead th { position: sticky; top: 0; background: var(--soft); cursor: pointer; font-weight: 500; }
.sw th.ln { position: sticky; left: 0; background: #fff; min-width: 96px; width: 96px; font: 600 13px Jost; color: var(--lc, var(--ink-2)); border-left: 4px solid var(--lc, var(--line)); z-index: 1; }
.sw thead th.ln { z-index: 2; }
.sw td.v { background: #fffaf4; }
.lc { margin-bottom: 5px; line-height: 1.35; }
.lc.same { color: var(--muted); }
.lc span { display: block; font-size: 11px; }
.lc .lw { color: var(--teal-deep); } .lc .lh2 { color: var(--blue); } .lc .ly { color: var(--ink-2); font-style: italic; } .lc .lt { color: #b45a1c; }

/* ===== v3: shared actions (move together / talk / same task) ===== */
.together { border: 1px dashed #b9c2ca; border-radius: 12px; padding: 10px; margin-bottom: 10px; background: var(--soft); }
.pickrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
.pk { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-left: 4px solid var(--lc); background: #fff; border-radius: 10px; min-height: 42px; padding: 0 10px 0 6px; cursor: pointer; font-size: 13px; }
.pk.on { background: #fff8e0; box-shadow: 0 0 0 2px var(--ink); }
.act { border: 1px solid var(--line); border-left: 5px solid var(--teal); border-radius: 12px; padding: 9px 10px; margin-bottom: 8px; background: #fff; }
.act.move { border-left-color: #D81B60; } .act.talk { border-left-color: var(--blue); } .act.task { border-left-color: var(--violet); }
.act.drawing { box-shadow: 0 0 0 2px #D81B60; }
.act-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.act-h .ic { font-size: 18px; }
.act-h .lbl { flex: 1; min-width: 160px; font-weight: 600; }
.mbs { display: flex; gap: 3px; flex-wrap: wrap; }
.mb { border: 0; background: none; padding: 0; cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; }
.mb i { font-size: 9px; color: #b0124f; font-style: normal; font-weight: 600; }
.sugs.show { display: flex; margin: 6px 0 2px; }
.rt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; }
.rt b { font: 600 12px Jost; color: #b0124f; }
.rt .rtx i { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: #D81B60; color: #fff; font: 600 9px Jost; font-style: normal; margin-right: 2px; }
.rt select { width: auto; min-height: 32px; padding: 2px 6px; }
.act-f { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px; align-items: center; margin-top: 6px; }
.act-f input { min-height: 36px; }
.dia.routing { box-shadow: 0 0 0 3px #D81B60; }
.dia.routing svg { cursor: crosshair; }
.ins { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.in { font-size: 12px; border-radius: 6px; padding: 2px 7px; background: var(--soft); border: 1px solid var(--line); }
.in.main { font-weight: 600; }
.in.move { border-color: #f2b7cb; background: #fff7fa; } .in.talk { border-color: #b9c9e6; background: var(--blue-tint); } .in.task { border-color: #cfc9ee; background: var(--lavender); }

/* ===== v4: scene board (map + actions / roles) ===== */
.rec { grid-template-columns: 210px minmax(0, 1fr); }
.bd-card { display: flex; flex-direction: column; height: calc(100dvh - 90px); padding: 10px 12px 0; overflow: hidden; }
.bd-card > .sh { flex-wrap: wrap; gap: 6px 8px; margin-bottom: 4px; }
.bd-card .when { display: inline-flex; gap: 6px; align-items: center; margin: 0; }
.bd-card .when input { width: 70px; min-height: 34px; }
.bd-card .seg.src button { min-height: 34px; padding: 0 10px; }
.bd-card .cut { margin-bottom: 6px; font-size: 12px; }
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(330px, 1fr); gap: 12px; }
.mapcol { min-height: 0; display: flex; flex-direction: column; }
.mapcol .dwrap { flex: 1; min-height: 0; }
.mapcol .dia { height: 100%; }

/* ===== v6.3 colour system =====
   black / white = theme · colour = role (LANE_COLOR) · teal = selected / to fill · yellow = warning (? not asked, barrier).
   The map base (spaces, routes, doors) is left as it is for now. */
:root { --state: #1c9c8c; --state-deep: #147a6e; --state-tint: #e3f3f1;
  --warn: #e0a400; --warn-line: #eccb63; --warn-tint: #fff6d3; --warn-ink: #7a5600; }
/* neutral chrome */
.sid, .pill.ok, .tag.new, .tag.chg, .tag.var { background: #eceef1; color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); }
#timer .btn.primary { background: #fff; color: var(--ink); border-color: #fff; }
.lnk { color: var(--ink-2); }
.strip .add, .add-wide { color: var(--ink); }
.sc { border-left: 1px solid var(--line); }
.sc.var { border-left: 1px dashed #b9c2ca; border-style: dashed; margin-left: -2px; }
.sc.on { box-shadow: none; border-color: var(--state); background: var(--state-tint); }
.cond { background: var(--soft); border: 1px solid var(--line); } .cond b { color: var(--ink-2); }
.chip.dig, .chip.jn, .chip.mv { border-color: var(--line); color: var(--ink); }
.chip.vb.move, .chip.vb.talk, .chip.vb.screen, .chip.vb.wait, .chip.vb.task { border-color: var(--line); }
.composer { border: 1px solid var(--ink); background: #fff; }
.pop, .composer .pop.verbs { border: 1px solid var(--line); background: var(--soft); }
.s-via, .s-on, .s-rt, .s-io, .s-wh, .tk .s-wh, .rr .rl .wh { color: var(--ink-2); }
.s-wh { font-weight: 600; }
.jrow { border-color: var(--line); } .jrow:hover { background: var(--soft); }
.sw td.v { background: var(--soft); }
.lc .lw, .lc .lh2, .lc .lt { color: var(--ink-2); }
/* role colour: card edge = subject's role, names in sentences are role-coloured */
.acts .ac, .acts .ac.move, .acts .ac.talk, .acts .ac.screen, .acts .ac.wait, .acts .ac.task { border-left: 4px solid var(--lc, var(--line)); }
.rn { font-weight: 600; }
/* teal = selected / to fill */
.seg button.on, .seg.src button.on[data-v=Est], .seg.src button.on[data-v=Sim] { background: var(--state-deep); color: #fff; }
.rr.on { background: var(--state-tint); box-shadow: 0 0 0 2px var(--state); }
.pk.on { background: var(--state-tint); box-shadow: 0 0 0 2px var(--state); }
.tk.on { background: var(--state-tint); border-color: var(--state); }
.tk.empty { color: var(--state-deep); border: 1px dashed var(--state); background: #fff; }
.composer .tk.ghost { opacity: .5; }
.ad.on { border-color: var(--state); background: var(--state-tint); color: var(--ink); }
.ad.set { border-color: var(--ink-2); color: var(--ink); background: #fff; font-weight: 500; }
.jrow .jp, .chip.add { color: var(--state-deep); border-color: var(--state); }
/* yellow = warning */
.bar { background: var(--warn-tint); border-color: var(--warn-line); color: var(--warn-ink); }
.bar button { color: var(--warn-ink); }
.ad.set[data-act=bar-arm] { border-color: var(--warn); background: var(--warn-tint); color: var(--warn-ink); }
.tk.pickable { border: 1px dashed var(--warn); background: var(--warn-tint); animation: pulsew 1.2s ease-in-out infinite; }
@keyframes pulsew { 50% { background: #ffe9a3; } }
.pickbar { color: var(--warn-ink); background: var(--warn-tint); border-color: var(--warn-line); }
.ib.ask.on, .askdot { background: var(--warn-tint); border-color: var(--warn); color: var(--warn-ink); }
.warnt { color: var(--warn-ink); }
.cut .warn { background: var(--warn-tint); border-color: var(--warn-line); color: var(--warn-ink); }
.lc .lb { color: var(--warn-ink); }
.tk.empty.on { background: var(--state-tint); border-style: solid; }
.s-at { color: var(--ink-2); }
.when input.auto { color: var(--muted); font-style: italic; } .srctag { font-size: 12px; color: var(--ink-2); } .dm.man { color: var(--ink); font-weight: 600; } .dm { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tw { font-size: 12px; color: var(--warn-ink); background: var(--warn-tint); border: 1px solid var(--warn-line); border-radius: 6px; padding: 2px 7px; }
.when .clk { font-size: 16px; } .when input[data-in=ts] { width: 72px; font: 600 16px Jost; }
.when input[data-in=ts].auto { color: var(--ink); font-style: normal; border-style: dashed; }

/* ===== v7: branches (fork / join) and decision points ===== */
.strip.strip2 { display: grid; gap: 5px 6px; align-items: stretch; grid-auto-rows: minmax(44px, auto); }
.strip2 .gc { display: flex; align-items: stretch; gap: 3px; min-width: 0; }

.strip2 .gc.lab { position: sticky; left: 0; z-index: 2; background: var(--bg); padding-right: 4px; }
.strip2 .rlab { display: flex; align-items: center; gap: 4px; width: 100%; font-size: 12px; color: var(--ink-2); text-align: left; border: 0; background: none; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.strip2 .rlab.br { border: 1px dashed #b9c2ca; border-radius: 9px; background: #fff; cursor: pointer; }

.brl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: #fff; border-left: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0 12px 6px; font-size: 12.5px; }
.brtag { border: 1px dashed #9aa4ae; background: var(--soft); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; color: var(--ink); cursor: pointer; text-align: left; }
.brtag.dec { cursor: default; border-style: solid; border-color: var(--ink-2); background: #fff; }

.brl .lnk { font-size: 12.5px; }
/* v7.1: inline branch editor, span picking, ◀ ▶ handles */
.bdp { background: #fff; border: 1px solid var(--ink); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 8px; flex: none; }
.bdp .row { gap: 8px; flex-wrap: wrap; }

.bdp .lbl { width: 76px; }
.seg.sm button { min-height: 34px; padding: 0 10px; font-size: 12.5px; }
.strip2 .hdl { align-self: center; border: 1px solid var(--line); background: #fff; border-radius: 7px; width: 26px; height: 30px; font-size: 11px; color: var(--ink-2); cursor: pointer; flex: none; padding: 0; }
.strip2 .hdl:hover { border-color: var(--state); color: var(--state-deep); }
.strip2 .join { display: flex; align-items: center; gap: 4px; }

.strip2.picking .gc .sc:not(.var) { border-color: var(--state); border-style: dashed; }
.strip2 .sc.pk1 { background: var(--state-tint); border: 2px solid var(--state) !important; }
.strip2 .rlab.pend { border: 1px dotted #b9c2ca; border-radius: 9px; color: var(--muted); }
.strip2 .pendc { align-self: center; font-size: 12px; color: var(--muted); font-style: italic; white-space: nowrap; }
