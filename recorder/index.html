<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walkthrough Recorder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#147a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recorder">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --teal: #1c9c8c; --teal-deep: #147a6e; --teal-tint: #e3f3f1;
  --orange: #e8843c; --orange-tint: #fcefe4;
  --violet: #6b63c4; --lavender: #ecebf8;
  --ink: #1f2a33; --ink-2: #4a5661; --muted: #7c8792;
  --line: #dfe3e8; --bg: #f3f4f6; --soft: #f7f8fa;
  --chg: #fff4d6; --chg-line: #d9a520; --bad: #a32b2b;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 Inter, -apple-system, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: Jost, -apple-system, sans-serif; margin: 0; }
.app { display: flex; flex-direction: column; height: 100%; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: max(8px, env(safe-area-inset-top)) 14px 8px; background: #fff; border-bottom: 1px solid var(--line); }
.top h1 { font-size: 18px; font-weight: 600; }
.sid { font: 600 12px Jost; color: var(--teal-deep); background: var(--teal-tint); border-radius: 6px; padding: 2px 8px; }
.sid:empty { display: none; }
#tabs { display: flex; gap: 4px; flex: 1; }
#tabs button { border: 1px solid var(--line); background: #fff; border-radius: 9px; min-height: 38px; padding: 0 14px; cursor: pointer; }
#tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.saved { font-size: 11px; color: var(--muted); }
main { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }

.btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; min-height: 40px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--teal-deep); color: #fff; border-color: var(--teal-deep); }
.btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.br { border-color: var(--orange); color: #b45a1c; }
.btn.danger { color: var(--bad); }
.btn.primary.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.big { min-height: 48px; font-size: 15px; padding: 0 20px; font-weight: 600; }
.btn.sm { min-height: 32px; padding: 0 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

/* record layout */
.rec { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(380px, 460px); gap: 12px; align-items: start; }
.rec > * { min-width: 0; }
.tl { position: sticky; top: 0; max-height: calc(100vh - 90px); overflow: auto; }
.ed { position: sticky; top: 0; max-height: calc(100vh - 90px); overflow: auto; }
@media (max-width: 1100px) {
  .rec { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .tl { grid-column: 1 / -1; position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .tl .ev { flex: none; width: 150px; margin: 0; }
  .tl .ev.br { margin-left: 0; width: 150px; }
  .tl .tlh { display: none; }
}
@media (max-width: 720px) { .rec { grid-template-columns: 1fr; } .ed { position: static; max-height: none; } }

.tlh { font: 600 10px Jost; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 2px 0 6px; }
.ev { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-left: 5px solid var(--teal); background: #fff; border-radius: 9px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer; }
.ev.br { margin-left: 14px; width: calc(100% - 14px); border-left-color: var(--orange); border-style: dashed; border-left-style: solid; }
.ev.draft { border-left-color: var(--ink); background: var(--soft); border-style: dashed; border-left-style: solid; }
.ev.on { box-shadow: 0 0 0 2px var(--ink); }
.ev b { font: 600 13px Jost; } .ev .m { font-size: 11px; color: var(--muted); } .ev .c { font-size: 11px; color: #b45a1c; }

/* scene */
.scene-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.scene-h h2 { font-size: 22px; font-weight: 700; }
.tag { font: 600 10px Jost; letter-spacing: .1em; text-transform: uppercase; border-radius: 5px; padding: 2px 7px; background: #eceef1; color: var(--ink-2); }
.tag.draft { background: var(--ink); color: #fff; }
.tag.br { background: var(--orange-tint); color: #b45a1c; }
.cond { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--orange-tint); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
.cond b { font: 600 10px Jost; letter-spacing: .12em; text-transform: uppercase; color: #b45a1c; }
.hint { font-size: 12.5px; color: var(--ink-2); background: #fffbef; border: 1px solid #f0dfa8; border-radius: 9px; padding: 7px 10px; margin-bottom: 8px; }
.ent { position: relative; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--teal); border-radius: 11px; padding: 9px 44px 9px 11px; margin-bottom: 7px; cursor: pointer; }
.ent.sp { border-left-color: var(--violet); }
.ent.none { border-left-color: #c3c9d0; }
.ent.on { box-shadow: 0 0 0 2px var(--ink); }
.ent.chg { background: #fffcf1; }
.ent .x { position: absolute; top: 6px; right: 6px; width: 34px; min-height: 34px; padding: 0; }
.ent-h { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ent-h .act { font: 600 15px Jost; }
.kd { font: 600 9px Jost; letter-spacing: .12em; padding: 1px 6px; border-radius: 4px; background: var(--teal-tint); color: var(--teal-deep); }
.kd.sp { background: var(--lavender); color: #4b44a3; }
.kd.chg { background: var(--chg); color: #8a6400; } .kd.car { background: #eceef1; color: var(--muted); }
.ent-l { font-size: 12.5px; margin-top: 3px; color: var(--ink-2); }
.ent-l .lb { font: 600 9.5px Jost; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.warn { font-size: 11.5px; color: var(--bad); margin-top: 3px; }
.tok { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 7px; margin: 1px 2px 1px 0; background: #f0f2f4; }
.tok.r { background: #e9f4f2; }
.tok.io-in { background: #e7f1fb; } .tok.io-out { background: #fcefe4; }
.scene-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.scene-f .grow { flex: 1; }
textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; resize: vertical; background: #fff; }
input[type=text], select { border: 1px solid var(--line); border-radius: 9px; min-height: 40px; padding: 0 10px; background: #fff; }

/* editor */
.ed .card { padding: 10px 12px; }
.ed-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ed-h h3 { font-size: 16px; flex: 1; }
.sec { border-top: 1px solid var(--line); padding: 9px 0; }
.sec:first-of-type { border-top: 0; }
.sh { display: flex; align-items: center; gap: 7px; font: 600 11px Jost; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-deep); margin-bottom: 6px; }
.sh .n { width: 20px; height: 20px; border-radius: 50%; background: var(--teal-tint); display: grid; place-items: center; font-size: 11px; letter-spacing: 0; }
.sh .ok { background: var(--teal); color: #fff; }
.sh .r { margin-left: auto; text-transform: none; letter-spacing: 0; font: 400 11px Inter; color: var(--muted); }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border: 1px solid var(--line); background: #fff; border-radius: 10px; cursor: pointer; font-weight: 600; }
.seg button.on { background: var(--teal-deep); border-color: var(--teal-deep); color: #fff; }
.seg button.on.sp { background: var(--violet); border-color: var(--violet); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 9px; min-height: 38px; padding: 4px 10px; cursor: pointer; text-align: left; font-size: 13px; }
.chip i { font-style: normal; font: 600 9.5px Jost; color: var(--muted); margin-right: 4px; }
.chip.on { background: var(--chg); border-color: var(--chg-line); box-shadow: inset 0 0 0 1px var(--chg-line); }
.chip.sug { border-color: var(--teal); border-style: dashed; }
.chip.sp { color: #1e63c4; border-style: dashed; border-color: #1e63c4; }
.chip.add { color: var(--teal-deep); border-style: dashed; }
.grp { font: 500 9.5px Jost; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); width: 100%; margin: 6px 0 1px; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.acts button { min-height: 52px; border: 1px solid var(--line); background: #fff; border-radius: 10px; cursor: pointer; text-align: left; padding: 6px 10px; }
.acts button b { display: block; font: 600 14px Jost; }
.acts button span { display: block; font-size: 11px; color: var(--muted); line-height: 1.25; }
.acts button.on { background: var(--chg); border-color: var(--chg-line); box-shadow: inset 0 0 0 1px var(--chg-line); }
.sel { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.stok { display: inline-flex; align-items: center; gap: 2px; background: var(--teal-tint); border-radius: 9px; padding: 2px 2px 2px 9px; font-size: 13px; }
.stok button { border: 0; background: transparent; min-height: 34px; min-width: 32px; cursor: pointer; border-radius: 7px; }
.stok button.inst { font: 600 12px Jost; background: #fff; }
.iorow { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.iorow .nm { flex: 1; font-size: 13px; }
.iorow .seg button { min-height: 34px; flex: none; padding: 0 10px; font-weight: 500; font-size: 12.5px; }
.iorow .seg button.on { background: #1e63c4; border-color: #1e63c4; }
.iorow .seg button.on.out { background: var(--orange); border-color: var(--orange); }

/* site diagram (reserved) */
.dia { border: 2px dashed #c9d2d8; border-radius: 12px; background: var(--soft); margin-bottom: 8px; overflow: hidden; }
.dia.empty { display: grid; place-items: center; min-height: 120px; text-align: center; padding: 12px; color: var(--muted); font-size: 12.5px; }
.dia.empty b { display: block; font: 600 13px Jost; letter-spacing: .08em; color: var(--ink-2); margin-bottom: 2px; }
.dia svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.dia .pt { cursor: pointer; }
.pm { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.pm .seg button { min-height: 32px; flex: none; padding: 0 10px; font-size: 12px; }

/* data + session */
.tscroll { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
table.dt { border-collapse: collapse; width: 100%; font-size: 12px; }
table.dt th, table.dt td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.dt th { font: 500 10px Jost; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); background: var(--soft); position: sticky; top: 0; }
table.dt tr.br td { background: #fffaf4; }
table.dt tr[data-go] { cursor: pointer; }
table.dt td.y { background: var(--chg); font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; align-items: start; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.field > span { font: 500 10.5px Jost; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
.srow { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.srow .grow { flex: 1; min-width: 0; }
.srow.on b { color: var(--teal-deep); }
.prow { display: grid; grid-template-columns: 70px minmax(0, 1fr) 118px auto; gap: 6px; align-items: center; padding: 4px 0; }
.prow code { font: 600 11px Jost; color: var(--ink-2); word-break: normal; }
.prow input, .prow select { width: 100%; min-width: 0; }
@media (max-width: 600px) { .prow { grid-template-columns: 70px minmax(0, 1fr); } }
.card code { word-break: break-all; font-size: 11.5px; }
.pill { display: inline-block; font-size: 11.5px; border-radius: 7px; padding: 3px 8px; background: #eceef1; }
.pill.ok { background: #dff2e3; color: #2d7a3d; } .pill.warn { background: #fde3e3; color: var(--bad); }
.welcome { max-width: 640px; margin: 20px auto; }
.welcome h2 { font-size: 24px; margin-bottom: 4px; }

/* dialogs + toast */
.dlg-bg { position: fixed; inset: 0; background: rgba(20,24,30,.38); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dlg { background: #fff; border-radius: 14px; padding: 18px; width: min(480px, 100%); max-height: calc(100vh - 40px); overflow: auto; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
.dlg p { margin: 0 0 12px; font-size: 14px; line-height: 1.45; }
.dlg input[type=text] { width: 100%; font-size: 15px; }
.dlg .chips { margin-bottom: 8px; }
.dlg-act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: #22252b; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* entry editor: 3 steps, swipe left/right between steps, scroll up/down inside a step */
.ed { overflow: visible; max-height: none; }
.edc { display: flex; flex-direction: column; height: calc(100vh - 92px); height: calc(100dvh - 92px); padding: 10px 0 0; overflow: hidden; }
.edc .ed-h { padding: 0 12px; }
.edc .ed-h .btn.cl { width: 36px; padding: 0; }
.stabs { display: flex; gap: 4px; padding: 4px 12px 8px; border-bottom: 1px solid var(--line); }
.stabs button { flex: 1; min-height: 40px; border: 1px solid var(--line); background: #fff; border-radius: 9px; cursor: pointer; font-size: 12px; padding: 2px 4px; color: var(--ink-2); }
.stabs button b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--teal-tint); color: var(--teal-deep); font: 600 11px Jost; margin-right: 4px; }
.stabs button.ok b { background: var(--teal); color: #fff; }
.stabs button.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); font-weight: 600; }
.steps { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.step { flex: 0 0 100%; min-width: 0; overflow-y: auto; overscroll-behavior-y: contain; scroll-snap-align: start; scroll-snap-stop: always; padding: 4px 12px 12px; -webkit-overflow-scrolling: touch; }
.stepnav { display: flex; gap: 8px; align-items: center; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--line); }
@media (max-width: 720px) { .edc { height: 78vh; } }

/* v5 layout: narrow entry list left, the entry editor takes the rest */
.rec { grid-template-columns: 250px minmax(0, 1fr); gap: 14px; }
.list { position: sticky; top: 0; max-height: calc(100vh - 92px); max-height: calc(100dvh - 92px); overflow-y: auto; padding-right: 2px; }
.ed { position: static; }
.ed-h h3 { flex: none; font-size: 18px; }
.ed-h .warn { margin: 0; }
.lh { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; } .lh b { font: 600 15px Jost; }
.ec { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 10px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer; }
.ec.sp { border-left-color: var(--violet); } .ec.none { border-left-color: #c3c9d0; }
.ec.brv { margin-left: 14px; width: calc(100% - 14px); border-left-color: var(--orange); border-style: dashed; border-left-style: solid; }
.ec.on { box-shadow: 0 0 0 2px var(--ink); }
.ec-h { display: flex; align-items: center; gap: 6px; }
.ec-h .act { font: 600 14px Jost; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ec-l { display: block; font-size: 12px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ec-l.brc { color: #b45a1c; } .ec-l.io { color: #1e63c4; }
.eid { font: 600 11px Jost; color: var(--muted); background: #f0f2f4; border-radius: 5px; padding: 1px 5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
.add-wide { width: 100%; border-style: dashed; color: var(--teal-deep); }
.empty-ed { min-height: 50vh; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 10px; padding: 32px; }
.empty-ed h2 { font-size: 24px; } .empty-ed p { max-width: 560px; line-height: 1.5; margin: 0; }
.edc { height: calc(100vh - 92px); height: calc(100dvh - 92px); }
.step { padding: 6px 18px 16px; }
.edc .ed-h, .stabs { padding-left: 18px; padding-right: 18px; }
.stabs button { font-size: 13.5px; min-height: 44px; }
.acts { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.chip.on.out { background: var(--orange-tint); border-color: var(--orange); box-shadow: inset 0 0 0 1px var(--orange); }
.chip.all { border-color: #1e63c4; }
.stok.in { background: #e7f1fb; }
.prod { border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; margin: 6px 0; }
.prod-h { font-size: 12.5px; color: var(--ink-2); margin-bottom: 5px; }
.vgrp { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border: 1px dashed #b9c9e6; border-radius: 10px; }
details.outside { margin-top: 8px; } details.outside summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); min-height: 36px; display: flex; align-items: center; }
.ent.brv { border-left-color: var(--orange); }
@media (max-width: 760px) {
  .rec { grid-template-columns: 1fr; }
  .list { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; }
  .list .lh, .list .add-wide { display: none; }
  .ec { flex: none; width: 170px; margin: 0; } .ec.brv { margin: 0; width: 170px; }
  .edc { height: 80vh; }
}

/* site diagrams: sheets, tappable spaces, added-point pins */
.shtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.shtabs button { border: 1px solid var(--line); background: #fff; border-radius: 8px; min-height: 36px; padding: 0 12px; cursor: pointer; font-size: 13px; }
.shtabs button.on { background: var(--teal-deep); border-color: var(--teal-deep); color: #fff; }
.dia { border-style: solid; border-width: 1px; background: #fff; }
.dia svg { max-height: 62vh; }
.dia .np { pointer-events: none; }
.dia .pt { cursor: pointer; }
.dia .pt:hover rect { stroke-width: 2.5; }
.dia.placing-on { box-shadow: 0 0 0 3px #1e63c4; cursor: crosshair; }
.dia.placing-on .pt { cursor: crosshair; }
.placing { display: flex; align-items: center; gap: 8px; background: #e7f1fb; color: #1e4f99; border-radius: 9px; padding: 6px 10px; margin-bottom: 6px; font-size: 13px; }
.placing .btn { margin-left: auto; }
.chip.unpl { border-style: dashed; color: #8a6400; }
.chip.tmp { border-style: dashed; border-color: #1e63c4; color: #1e4f99; }
details.plist { margin-top: 6px; } details.plist summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); min-height: 34px; display: flex; align-items: center; }
details.plist .chips { margin-top: 4px; }
.prow2 { display: grid; grid-template-columns: 70px minmax(0, 1fr) 118px auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.prow2 .wide { grid-column: 2 / -1; }
.prow2 code { font: 600 11px Jost; color: var(--ink-2); word-break: normal; }
.prow2 input, .prow2 select { width: 100%; min-width: 0; }
.dia { overflow-x: auto; overflow-y: hidden; }
.dia svg { max-height: none; max-width: none; }
.shtabs .zl { font: 600 12px Jost; color: var(--muted); align-self: center; min-width: 40px; text-align: center; }
.shtabs button[disabled] { opacity: .35; }

/* map window: fixed size, pinch / drag inside; floor picker + zoom overlaid (indoor-map style) */
.dwrap { position: relative; margin-bottom: 6px; }
.dwrap .dia { height: min(56vh, 560px); overflow: hidden; margin: 0; background: #F1F4F3; }
.dwrap .dia svg { width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.floors { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.12); max-width: 46%; }
.floors button { border: 0; border-bottom: 1px solid var(--line); background: #fff; min-height: 40px; padding: 0 12px; cursor: pointer; font-size: 12.5px; text-align: left; }
.floors button:last-child { border-bottom: 0; }
.floors button.on { background: var(--teal-deep); color: #fff; font-weight: 600; }
.zooms { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.zooms button { border: 0; border-bottom: 1px solid var(--line); background: #fff; width: 44px; height: 42px; font-size: 20px; cursor: pointer; }
.zooms button.fit { font-size: 11.5px; font-weight: 600; border-bottom: 0; }

.route { border: 1px solid #f2b7cb; background: #fff7fa; border-radius: 10px; padding: 7px 9px; margin: 4px 0 6px; }

<script>
/* Walkthrough Recorder v5 — entry model (option sets v3, pilot-validated).
   Session → Entry. No snapshots: sequence comes only from input → output links.
   An entry's inputs are outputs of other entries (info artifacts or state artifacts), possibly several.
   Branch version = copy of an entry under a condition; a later input can take one version's output or all versions.
   Standalone: no site library import. Site bubble diagrams: loaded from data/diagrams/site_diagrams.json on each device (not bundled). */
(() => {
'use strict';
const O = window.OPTS;
const KEY = 'wtrec-v5';
const SPECIAL = { DIGITAL: 'Digital (no physical spot)', TRANSIT: 'In transit (with patient)' };
const byId = {};
['types', 'roles', 'actions', 'tools', 'tech', 'info', 'states', 'conditions'].forEach(k => O[k].forEach(x => { byId[x.id] = x; }));
const OTHER = id => /99$/.test(id);
const isState = id => /^ST/.test(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iso = () => new Date().toISOString();
const pad = (n, w) => String(n).padStart(w, '0');
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- storage (IndexedDB, localStorage fallback) ---------- */
const store = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('wtrec', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  return {
    async get(k) { try { const db = await open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { try { return JSON.parse(localStorage.getItem(k)); } catch (e2) { return null; } } },
    async set(k, v) { try { const db = await open(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e2) { return false; } } }
  };
})();

let S = { v: 5, sessions: [], cur: null, points: { LMH: [], WCM: [] }, diagrams: { LMH: null, WCM: null } };
const ui = { view: 'record', ei: null, pm: 'where', step: 0, edKey: '', sheet: {}, placing: null, vb: {}, noClick: 0 };
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const ok = await store.set(KEY, S);
    document.getElementById('saved').textContent = ok ? 'Saved on this device ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '⚠ Not saved';
  }, 250);
}

/* ---------- helpers ---------- */
const sess = () => S.sessions.find(s => s.session_id === S.cur) || null;
const ents = () => (sess() ? sess().entries : []);
const findE = id => ents().find(e => e.entry_id === id);
const baseOf = e => (e.branch_of_entry_id ? findE(e.branch_of_entry_id) || e : e);
const versionsOf = base => [base, ...ents().filter(x => x.branch_of_entry_id === base.entry_id)];
const short = id => (id || '').replace((sess() ? sess().session_id : '') + '-', '');
const curEntry = () => (ui.ei ? findE(ui.ei) : null);
/* display order: base entries by seq, each followed by its branch versions */
function ordered() {
  const all = ents(), bases = all.filter(e => !e.branch_of_entry_id).sort((a, b) => a.seq - b.seq);
  return bases.flatMap(b => [b, ...all.filter(x => x.branch_of_entry_id === b.entry_id)]);
}
const roleKeyLabel = k => { const [rid, n] = k.split('#'); return (byId[rid] ? byId[rid].label : rid) + ' #' + n; };
function sitePoints(site) {
  const d = S.diagrams[site];
  return [...((d && d.points) || []), ...(S.points[site] || [])];
}
const sheetsOf = site => (S.diagrams[site] && S.diagrams[site].sheets) || [];
const sheetName = (site, id) => { const sh = sheetsOf(site).find(x => x.id === id); return sh ? sh.name : ''; };
function curSheet(site) {
  const sh = sheetsOf(site); if (!sh.length) return null;
  return sh.find(x => x.id === ui.sheet[site]) || sh[0];
}
function ptLabel(id) {

    if (prev && prev.sheet === sh.id) { const [x0, y0] = pos(prev); rsvg += `<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="#D81B60" stroke-width="${fs / 2.6}" stroke-linecap="round" marker-end="url(#rarr)" class="np"/>`; }
    if (prev && prev.sheet !== sh.id) rsvg += `<text x="${x}" y="${y + fs * 2.6}" font-size="${fs}" text-anchor="middle" fill="#D81B60" font-weight="700" class="np">from ${esc(sheetName(site, prev.sheet))}</text>`;
    if (next && next.sheet !== sh.id) rsvg += `<text x="${x}" y="${y + fs * 2.6}" font-size="${fs}" text-anchor="middle" fill="#D81B60" font-weight="700" class="np">to ${esc(sheetName(site, next.sheet))} →</text>`;
  });
  route.forEach((w, i) => {
    if (w.sheet !== sh.id) return;
    const [x, y] = pos(w), r = w.stop ? fs * 1.25 : fs * 0.85;
    rsvg += `<g class="np"><circle cx="${x}" cy="${y}" r="${r}" fill="${w.stop ? '#E8843C' : '#D81B60'}" stroke="#fff" stroke-width="${fs / 6}"/><text x="${x}" y="${y + fs * 0.36}" font-size="${fs * 0.95}" font-weight="700" text-anchor="middle" fill="#fff">${i + 1}</text></g>`;
  });
  const defs = `<defs><marker id="rarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1L9 5L1 9z" fill="#D81B60"/></marker></defs>`;
  return pmRow + banner + `<div class="dwrap"><div class="dia${placing ? ' placing-on' : ''}${pm === 'route' ? ' routing' : ''}"><svg class="pz" viewBox="${vb.join(' ')}" data-key="${esc(key)}" data-base="${sh.viewBox.join(' ')}" data-site="${esc(site)}" data-sheet="${esc(sh.id)}">${defs}${deco}${zonesFirst.map(rect).join('')}${links}${temp}${rsvg}</svg></div>${floors}${zooms}</div>`
    + (route.length || pm === 'route' ? vRoute(site, e) : '')
    + `<p class="small muted" style="margin:4px 0 6px">Schematic, not to scale. Pinch or drag to zoom and move. Dashed lines = relationship not confirmed. Dashed circles with ? = points you added.</p>`;
}
function vRoute(site, e) {

function pointChips(site, cur, act) {
  const sh = curSheet(site), all = sitePoints(site);

  const tempBtn = curP && curP.provisional ? `<button class="chip add" data-act="place-start" data-v="${esc(curP.id)}">${curP.x != null ? 'Move pin of' : 'Place'} “${esc(curP.label)}” on diagram</button>` : '';

    + unplaced.map(chip).join('') + temp.map(chip).join('') + `<button class="chip add" data-act="new-pt" data-v="${act}">+ New point</button>${tempBtn}</div>`
    + (placed.length ? `<details class="plist"><summary>List of points on this sheet (${placed.length})</summary><div class="chips">${placed.map(chip).join('')}</div></details>` : '');
}
function techLabel(t) { const s = sess(); const site = s && s.site; return t[site] ? t.label + ' (' + t[site] + ')' : t.label; }

/* input picker: outputs of other entries, grouped by producer; versions shown when the producer has branches */
function inputPicker(e) {
  const me = baseOf(e).entry_id;
  const has = (from, art, all) => e.inputs.some(i => i.from === from && i.artifact === art && !!i.all === !!all);
  const bases = ordered().filter(x => !x.branch_of_entry_id && x.entry_id !== me);
  const myseq = baseOf(e).seq;
  const block = b => {
    const vers = versionsOf(b).filter(v => v.outputs.length);
    if (!vers.length) return '';
    const arts = [...new Set(vers.flatMap(v => v.outputs))];
    const multi = versionsOf(b).length > 1;
    const chips = arts.map(art => {
      if (!multi) return `<button class="chip${has(b.entry_id, art, false) ? ' on' : ''}" data-act="in-add" data-v="${b.entry_id}" data-art="${art}">${esc(outLabel(b, art))}</button>`;
      const verChips = versionsOf(b).filter(v => v.outputs.includes(art)).map(v => `<button class="chip${has(v.entry_id, art, false) ? ' on' : ''}" data-act="in-add" data-v="${v.entry_id}" data-art="${art}"><i>${v.branch_of_entry_id ? esc(condText(v)) : 'usual'}</i>${esc(outLabel(v, art))}</button>`).join('');
      return `<span class="vgrp"><button class="chip all${has(b.entry_id, art, true) ? ' on' : ''}" data-act="in-add" data-v="${b.entry_id}" data-art="${art}" data-all="1"><i>all versions</i>${esc(lbl(art, b))}</button>${verChips}</span>`;
    }).join('');
    return `<div class="prod"><div class="prod-h"><span class="eid">${esc(short(b.entry_id))}</span> ${esc(b.action_id ? lbl(b.action_id, b) : 'No action')} · ${esc(b.who.map(roleKeyLabel).join(', '))}</div><div class="chips">${chips}</div></div>`;
  };
  const earlier = bases.filter(b => b.seq < myseq).reverse().map(block).join('');
  const later = bases.filter(b => b.seq > myseq).map(block).join('');
  const outside = `<details class="outside"><summary>From outside the case (no earlier entry)</summary><div class="chips">` + [...O.info, ...O.states].map(x => `<button class="chip${has('', x.id, false) ? ' on' : ''}" data-act="in-add" data-v="" data-art="${x.id}">${esc(x.label)}</button>`).join('') + `</div></details>`;
  return (earlier || '<p class="small muted">No earlier entry has an output yet.</p>') + (later ? `<div class="grp">Entries added later</div>${later}` : '') + outside;
}

/* ---------- actions ---------- */
function applyActionDefaults(e, prev, next) {
  const pa = byId[prev], na = byId[next];
  const one = arr => (arr && arr.length === 1 ? [...arr] : []);
  const untouched = (cur, def) => cur.length === 0 || JSON.stringify([...cur].sort()) === JSON.stringify([...one(def)].sort());
  if (untouched(e.tool_ids, pa && pa.tools)) e.tool_ids = one(na && na.tools);
  if (untouched(e.technology_ids, pa && pa.tech)) e.technology_ids = one(na && na.tech);
  if (pa && pa.outState) e.outputs = e.outputs.filter(o => o !== pa.outState);
  if (na && na.outState && !e.outputs.includes(na.outState)) e.outputs.push(na.outState);
  if (na && !na.toWhere) e.to_point_id = '';
}
async function needOther(e, id) {
  if (!OTHER(id)) return true;
  const t = await ask('Specify “Other”', e.other[id] || '', 'short description');
  if (!t) return false; e.other[id] = t; return true;
}
function newPointDlg(site) {
  const sh = curSheet(site);
  return dialog(`<p><b>New point</b><br><span class="small muted">A place that is missing from the diagram. Write it down now; check how it relates to other spaces later.</span></p>
    <input type="text" data-l placeholder="Name, e.g. Fast track, CT 2, side entrance">
    <input type="text" data-n placeholder="Where roughly (optional), e.g. behind triage, near bed elevators" style="margin-top:8px">
    ${sh ? `<p class="small muted" style="margin:8px 0 0">Sheet: ${esc(sh.name)}</p>` : ''}
    <div class="dlg-act"><button class="btn" data-x>Cancel</button><button class="btn" data-ok>Save</button>${sh ? '<button class="btn primary" data-pl>Save + tap on diagram</button>' : ''}</div>`, (d, done) => {
    const l = d.querySelector('[data-l]'), n = d.querySelector('[data-n]'); setTimeout(() => l.focus(), 30);
    const go = place => { const label = l.value.trim(); if (!label) { l.focus(); return; } done({ label, note: n.value.trim(), place }); };
    d.querySelector('[data-x]').onclick = () => done(null);
    d.querySelector('[data-ok]').onclick = () => go(false);
    const pl = d.querySelector('[data-pl]'); if (pl) pl.onclick = () => go(true);
  });
}
async function newPoint(site) {
  const r = await newPointDlg(site); if (!r) return null;
  const list = S.points[site] || (S.points[site] = []);
  const id = site + '-P' + pad(Math.max(900, ...list.map(p => +p.id.split('-P')[1])) + 1, 3);
  const sh = curSheet(site);
  list.push({ id, label: r.label, note: r.note, sheet: sh ? sh.id : '', tool_id: '', provisional: true });
  if (r.place && sh) { ui.placing = id; toast('Tap the diagram where “' + r.label + '” roughly is.'); }
  return id;
}
async function makeBranch(e) {
  const s = sess(), base = baseOf(e);
  const c = await condDlg(e.branch_of_entry_id ? { condition_id: e.condition_id } : {}); if (!c) return;
  const n = Math.max(0, ...versionsOf(base).map(v => +((v.entry_id.match(/-B(\d+)$/) || [])[1] || 0))) + 1;
  const v = { ...clone(base), entry_id: base.entry_id + '-B' + n, branch_of_entry_id: base.entry_id, ...c };
  const last = versionsOf(base).pop(); s.entries.splice(s.entries.indexOf(last) + 1, 0, v);
  ui.ei = v.entry_id; save(); render();
  toast('Branch version ' + short(v.entry_id) + ' created. Change only what differs.');
}

async function onAct(act, v, el) {
  const s = sess(), e = curEntry();
  switch (act) {
    case 'view': ui.view = v; break;
    case 'add': { const ne = blankEntry(); s.entries.push(ne); ui.ei = ne.entry_id; save(); break; }
    case 'edit': { ui.ei = v; const x = findE(v), p = x && sitePoints(s.site).find(q => q.id === x.where_point_id); if (p && p.sheet) ui.sheet[s.site] = p.sheet; ui.placing = null; break; }
    case 'close-ed': ui.ei = null; break;
    case 'step': goStep(+v); return;
    case 'del-ent': {
      const x = findE(v); const vers = x.branch_of_entry_id ? [x] : versionsOf(x);
      const ids = new Set(vers.map(q => q.entry_id));
      const refs = ents().filter(c => !ids.has(c.entry_id) && c.inputs.some(i => ids.has(i.from))).length;
      const msg = `Delete ${short(v)}${vers.length > 1 ? ' and its ' + (vers.length - 1) + ' branch version(s)' : ''}?` + (refs ? ` ${refs} other entr${refs === 1 ? 'y uses' : 'ies use'} its output; those input links will be removed.` : '') + ' This cannot be undone.';
      if (!(await confirmDlg(msg, 'Delete', true))) return;
      s.entries = s.entries.filter(q => !ids.has(q.entry_id));
      s.entries.forEach(c => { c.inputs = c.inputs.filter(i => !ids.has(i.from)); });
      if (ids.has(ui.ei)) ui.ei = null; save(); break;
    }
    case 'dup': { const ne = { ...clone(e), ...blankEntryIds(), branch_of_entry_id: '', condition_id: '', condition_value: '', inputs: [] }; s.entries.push(ne); ui.ei = ne.entry_id; save(); toast('Duplicated as ' + short(ne.entry_id) + ' (inputs cleared).'); break; }
    case 'branch': await makeBranch(e); return;
    case 'cond-edit': { const c = await condDlg(e); if (!c) return; Object.assign(e, c); save(); break; }
    case 'type': if (e.type !== v) { const a = byId[e.action_id]; e.type = v; if (a && a.type !== v && a.type !== 'both') { applyActionDefaults(e, e.action_id, ''); e.action_id = ''; } save(); } break;
    case 'where': e.where_point_id = e.where_point_id === v ? '' : v; save(); break;
    case 'to': e.to_point_id = e.to_point_id === v ? '' : v; save(); break;
    case 'pm': ui.pm = v; break;
    case 'sheet': ui.sheet[s.site] = v; break;
    case 'rt-undo': (e.route || []).pop(); save(); break;
    case 'rt-clear': if (!(await confirmDlg('Clear the whole route of this entry?', 'Clear', true))) return; e.route = []; save(); break;
    case 'rt-stop': { const w = e.route[+v]; if (w.stop) { w.stop = false; delete w.stop_note; } else { const n = await ask('Stop at “' + w.label + '”. What happens here? (optional)', '', 'e.g. waits for CT, hands over, picks up tele-cart'); if (n === null && !(await confirmDlg('Mark as a stop without a note?', 'Mark stop'))) return; w.stop = true; if (n) w.stop_note = n; } save(); break; }
    case 'zoom': { const sh = curSheet(s.site); if (!sh) break; const key = s.site + '|' + sh.id;
      if (+v === 0) { delete ui.vb[key]; break; }
      const cur = ui.vb[key] || sh.viewBox, f = +v > 0 ? 1 / 1.5 : 1.5;
      ui.vb[key] = zoomVB(cur, sh.viewBox, f, cur[0] + cur[2] / 2, cur[1] + cur[3] / 2); break; }
    case 'place-start': ui.placing = v; { const p = S.points[s.site].find(q => q.id === v); const sh = curSheet(s.site); if (p && p.sheet && p.sheet !== (sh && sh.id) && p.x != null) ui.sheet[s.site] = p.sheet; } break;
    case 'place-cancel': ui.placing = null; break;
    case 'dpt': { const a = byId[e.action_id]; if (a && a.toWhere && ui.pm === 'to') e.to_point_id = v; else e.where_point_id = v; save(); break; }
    case 'new-pt': { const id = await newPoint(s.site); if (!id) return; if (e && v === 'where') e.where_point_id = id; if (e && v === 'to') e.to_point_id = id; save(); break; }
    case 'who-add': {
      if (e.who.some(k => k.startsWith(v + '#'))) { e.who = e.who.filter(k => !k.startsWith(v + '#')); save(); break; }
      if (!(await needOther(e, v))) return;
      const key = v + '#1'; e.who.push(key);
      if (!e.where_point_id) { const sp = lastSpot(e, key); if (sp) e.where_point_id = sp; }
      save(); break;
    }
    case 'who-cyc': { const [rid, n] = v.split('#'); let m = +n; do { m = m >= 6 ? 1 : m + 1; } while (e.who.includes(rid + '#' + m) && m !== +n); e.who = e.who.map(k => (k === v ? rid + '#' + m : k)); save(); break; }
    case 'who-del': e.who = e.who.filter(k => k !== v); if (OTHER(v.split('#')[0]) && !e.who.some(k => k.startsWith(v.split('#')[0]))) delete e.other[v.split('#')[0]]; save(); break;
    case 'action': {
      if (e.action_id === v && !OTHER(v)) break;
      if (!(await needOther(e, v))) return;
      const prev = e.action_id; e.action_id = v; applyActionDefaults(e, prev, v); save(); break;
    }
    case 'tool': case 'tech': {
      const k = act === 'tool' ? 'tool_ids' : 'technology_ids';
      if (e[k].includes(v)) { e[k] = e[k].filter(x => x !== v); if (OTHER(v)) delete e.other[v]; }
      else { if (!(await needOther(e, v))) return; e[k].push(v); }
      save(); break;
    }
    case 'out': {
      if (e.outputs.includes(v)) { e.outputs = e.outputs.filter(x => x !== v); if (OTHER(v)) delete e.other[v]; }
      else { if (!(await needOther(e, v))) return; e.outputs.push(v); }
      save(); break;
    }
    case 'in-add': {
      const art = el.dataset.art, all = !!el.dataset.all;
      const at = e.inputs.findIndex(i => i.from === v && i.artifact === art && !!i.all === all);
      if (at >= 0) { e.inputs.splice(at, 1); save(); break; }
      if (v) {
        const prodBase = baseOf(findE(v)).entry_id, me = baseOf(e).entry_id;
        if (reaches(me, prodBase)) { toast('That would make a loop: ' + short(prodBase) + ' already depends on this entry.'); return; }
      } else if (!(await needOther(e, art))) return;
      e.inputs.push(all ? { from: v, artifact: art, all: true } : { from: v, artifact: art });
      save(); break;
    }
    case 'in-del': e.inputs.splice(+v, 1); save(); break;
    /* session */
    case 'pick-site': ui.newSite = v; break;
    case 'start': {
      if (!ui.newSite) return;
      const sid = sessionId(ui.newSite);
      S.sessions.push({ session_id: sid, site: ui.newSite, observer: '', started_at: iso(), source: O.source, n: 0, entries: [] });
      S.cur = sid; ui.view = 'record'; ui.ei = null; ui.newSite = ''; save(); toast('Session ' + sid + ' started.'); break;
    }
    case 'open-s': S.cur = v; ui.ei = null; save(); break;
    case 'del-s': {
      const x = S.sessions.find(q => q.session_id === v);
      if (!(await confirmDlg(`Delete session ${v} (${x.entries.length} entries)${x.exported_at ? '' : '? It has NOT been exported'}? This cannot be undone.`, 'Delete', true))) return;
      S.sessions = S.sessions.filter(q => q.session_id !== v); if (S.cur === v) S.cur = S.sessions.length ? S.sessions[S.sessions.length - 1].session_id : null; save(); break;
    }
    case 'pt-del': S.points[s.site] = S.points[s.site].filter(p => p.id !== v); save(); break;
    case 'export': await exportSession(s); break;
    case 'export-all': await download('walkthrough-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S, null, 1), 'application/json'); return;
    case 'import': pickFile('data'); return;
    case 'import-dia': pickFile('dia'); return;
    case 'clear-dia': if (await confirmDlg('Remove the site diagrams from this device? Records keep their point IDs; load the file again to see them.', 'Remove', true)) { S.diagrams = { LMH: null, WCM: null }; save(); } break;
    default: return;
  }
  render();
}
function blankEntryIds() { const b = blankEntry(); return { entry_id: b.entry_id, seq: b.seq }; }

/* ---------- export / import ---------- */
const csvq = v => { const t = v == null ? '' : String(v); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
const csv = rows => rows.map(r => r.map(csvq).join(',')).join('\r\n') + '\r\n';
async function exportSession(s) {
  if (!s.entries.length) { toast('No entries yet.'); return; }
  const list = ordered();
  const ids = new Set(list.flatMap(e => [e.where_point_id, e.to_point_id]));
  const p = { format: 'walkthrough-recorder/v5', option_sets: O.source, states_source: O.states_source, exported_at: iso(),
    session: { session_id: s.session_id, site: s.site, observer: s.observer || '', started_at: s.started_at },
    points: sitePoints(s.site).filter(q => ids.has(q.id)).map(q => ({ id: q.id, label: q.label, sheet: q.sheet || '', sheet_name: sheetName(s.site, q.sheet), tool_id: q.tool_id || '', provisional: !!q.provisional, unplaced: !!q.unplaced || (q.provisional && q.x == null), note: q.note || '', x: q.x == null ? '' : Math.round(q.x), y: q.y == null ? '' : Math.round(q.y) })),
    entries: list.map(e => ({ ...clone(e), differs_from_base: differs(e) })) };
  const enRows = [['session_id', 'entry_id', 'seq', 'branch_of_entry_id', 'condition_id', 'condition', 'condition_value', 'differs_from_base', 'type', 'where_point_id', 'where_label', 'who', 'who_labels', 'action_id', 'action', 'to_point_id', 'to_label', 'route', 'route_stops', 'tool_ids', 'technology_ids', 'inputs', 'outputs', 'other_specified', 'note']]
    .concat(list.map(e => [s.session_id, e.entry_id, e.seq, e.branch_of_entry_id, e.condition_id, byId[e.condition_id] ? byId[e.condition_id].label : '', e.condition_value, differs(e).join(';'),
      byId[e.type] ? byId[e.type].label : '', e.where_point_id, ptLabel(e.where_point_id), e.who.join(';'), e.who.map(roleKeyLabel).join(';'), e.action_id, lbl(e.action_id, e), e.to_point_id, ptLabel(e.to_point_id), (e.route || []).map(w => w.point_id || (w.sheet + '@' + w.x + ',' + w.y)).join('>'), (e.route || []).map((w, i) => w.stop ? (i + 1) + ':' + (w.point_id || w.label) + (w.stop_note ? '=' + w.stop_note : '') : '').filter(Boolean).join(';'),
      e.tool_ids.join(';'), e.technology_ids.join(';'), e.inputs.map(i => (i.from || 'OUTSIDE') + (i.all ? '[all]' : '') + ':' + i.artifact).join(';'), e.outputs.join(';'), Object.entries(e.other || {}).map(([k, v]) => k + '=' + v).join(';'), e.note]));
  const lkRows = [['session_id', 'from_entry_id', 'from_versions', 'artifact_id', 'artifact', 'to_entry_id']]
    .concat(list.flatMap(e => e.inputs.map(i => [s.session_id, i.from || 'OUTSIDE', !i.from ? '' : i.all ? 'all' : 'this', i.artifact, lbl(i.artifact, e), e.entry_id])));
  const files = [[s.session_id + '.json', JSON.stringify(p, null, 1), 'application/json'], [s.session_id + '_entries.csv', csv(enRows), 'text/csv'], [s.session_id + '_links.csv', csv(lkRows), 'text/csv']];
  if (await downloadMany(files)) { s.exported_at = iso(); save(); render(); }
}
async function downloadMany(files) {
  try {
    const fs = files.map(([n, t, ty]) => new File([t], n, { type: ty }));
    if (navigator.canShare && navigator.canShare({ files: fs }) && 'ontouchend' in document) { await navigator.share({ files: fs }); toast('Shared ' + fs.length + ' files'); return true; }
  } catch (err) { if (err && err.name === 'AbortError') { toast('Not saved.'); return false; } }
  for (const [n, t, ty] of files) await download(n, t, ty, true);
  toast('Downloaded ' + files.length + ' files'); return true;
}
async function download(name, text, type, quiet) {
  if (!quiet) { try { const f = new File([text], name, { type }); if (navigator.canShare && navigator.canShare({ files: [f] }) && 'ontouchend' in document) { await navigator.share({ files: [f] }); toast('Shared ' + name); return; } } catch (e) { if (e && e.name === 'AbortError') { toast('Not saved.'); return; } } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  if (!quiet) toast('Downloaded ' + name);
  await new Promise(r => setTimeout(r, 300));
}
function loadDiagrams(j, name) {
  if (j.format !== 'site-diagrams/v1' || !j.sites) throw new Error('not a site-diagrams file');
  Object.entries(j.sites).forEach(([site, d]) => { S.diagrams[site] = { name, loaded_at: iso(), sheets: d.sheets, points: d.points }; });
  toast('Site diagrams loaded: ' + Object.keys(j.sites).join(', '));
}
let pickMode = '';
function pickFile(mode) { pickMode = mode; const f = document.getElementById('file-json'); f.value = ''; f.click(); }
document.getElementById('file-json').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (pickMode === 'dia') {
      loadDiagrams(j, f.name);
    } else if (j.v === 5 && Array.isArray(j.sessions)) {
      let n = 0;
      j.sessions.forEach(x => { if (!S.sessions.some(q => q.session_id === x.session_id)) { S.sessions.push(x); n++; } });
      ['LMH', 'WCM'].forEach(site => (j.points && j.points[site] || []).forEach(p => { if (!(S.points[site] || []).some(q => q.id === p.id)) (S.points[site] = S.points[site] || []).push(p); }));
      toast(`Backup imported: ${n} new session(s); existing ones left as they are.`);
    } else if (j.format === 'walkthrough-recorder/v5') {
      const sid = j.session.session_id;
      if (S.sessions.some(q => q.session_id === sid) && !(await confirmDlg(`Session ${sid} already exists on this device. Replace it with the file?`, 'Replace', true))) return;
      S.sessions = S.sessions.filter(q => q.session_id !== sid);
      const entries = j.entries.map(e => { const o = { ...e }; delete o.differs_from_base; return o; });
      S.sessions.push({ ...j.session, source: j.option_sets, n: Math.max(0, ...entries.map(e => e.seq || 0)), entries, exported_at: j.exported_at });
      (j.points || []).forEach(p => { const L = S.points[j.session.site] = S.points[j.session.site] || []; if (!L.some(q => q.id === p.id) && p.provisional) L.push(p); });
      S.cur = sid; toast('Session ' + sid + ' imported.');
    } else throw new Error('not a recorder v5 file');
    save(); render();
  } catch (err) { toast('Could not read this file: ' + err.message); }
});

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const go = ev.target.closest('tr[data-go]');
  if (go) { ui.view = 'record'; ui.ei = go.dataset.go; render(); return; }
  if (ui.noClick && Date.now() - ui.noClick < 450 && ev.target.closest('.dia svg')) { ui.noClick = 0; return; }
  const rsvg = !ui.placing && ui.pm === 'route' && ev.target.closest('.dia.routing svg');
  if (rsvg) { addWaypoint(rsvg, ev); return; }
  const svg = ui.placing && ev.target.closest('.dia svg');
  if (svg) {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const c = pt.matrixTransform(svg.getScreenCTM().inverse());
    const p = (S.points[svg.dataset.site] || []).find(q => q.id === ui.placing);
    if (p) { p.x = Math.round(c.x); p.y = Math.round(c.y); p.sheet = svg.dataset.sheet; toast('Pin placed for “' + p.label + '”.'); }
    ui.placing = null; save(); render(); return;
  }
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  ev.stopPropagation();
  onAct(b.dataset.act, b.dataset.v, b);
});
document.addEventListener('input', ev => {
  const t = ev.target, k = t.dataset.in; if (!k) return;
  if (k === 'enote') { curEntry().note = t.value; save(); }
  else if (k === 'ptnote') { const p = S.points[sess().site].find(p => p.id === t.dataset.v); p.note = t.value; save(); }
  else if (k === 'ptlabel') { const p = S.points[sess().site].find(p => p.id === t.dataset.v); p.label = t.value; save(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.in === 'pttool') { const p = S.points[sess().site].find(p => p.id === t.dataset.v); p.tool_id = t.value; save(); }
});

/* ---------- boot ---------- */
(async () => {
  const saved = await store.get(KEY);
  if (saved && saved.v === 5) S = Object.assign(S, saved);
  if (S.cur && !sess()) S.cur = S.sessions.length ? S.sessions[0].session_id : null;
  ui.view = sess() ? 'record' : 'session';
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
window.__wt = { S: () => S, ui, loadDiagrams: (j, n) => { loadDiagrams(j, n); save(); render(); } };
})();

</script>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
